sources:
  misp_microsoft_azure:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/microsoft-azure/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: provider_infrastructure
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Microsoft
      Azure datacenter IP ranges. Provider infrastructure reference, not a threat
      indicator.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-19T06:59:47Z'
      official_name: List of known Microsoft Azure Datacenter IP Ranges
      official_url: 
        https://github.com/MISP/misp-warninglists/blob/main/lists/microsoft-azure/list.json
      short_description: A MISP warninglist of Microsoft Azure public datacenter IP
        ranges in CIDR notation, used to flag connections from cloud-provider infrastructure
        as informational rather than threatening.
      long_description: "The MISP warninglists project publishes this list as a reference
        of known Microsoft Azure public datacenter IP ranges. It is not a threat indicator
        feed — it is a false-positive suppression list. When an analyst encounters
        an IP belonging to an Azure datacenter range, the MISP platform displays an
        informational or warning box alerting that the source is a cloud provider,
        not an attacker.\n\nThe list is generated by a Python script that downloads
        Microsoft's officially published Service Tags JSON file (published weekly
        at Microsoft's download centre) and converts it into the MISP warninglist
        format. The script extracts all address prefixes from the JSON's values[*].properties.addressPrefixes
        structure, consolidates overlapping CIDR ranges, and writes the resulting
        list to list.json. The list covers the global Azure public cloud and includes
        both IPv4 and IPv6 CIDR blocks.\n\nPer the project README, the list is licensed
        CC0 1.0 (Public Domain Dedication). The version field in the JSON uses a date-based
        stamp reflecting when the list was last regenerated."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: informal_collective
        official_url: https://www.misp-project.org/
        contact_email: info@misp-project.org
        based_in: Luxembourg
        active_since: '2014'
        notes: The MISP core team maintains the warninglists repository. The project
          is financially and resource-supported by CIRCL (Computer Incident Response
          Center Luxembourg). Individual contributors submit pull requests for specific
          list updates.
      - role: source_contributor
        name: Microsoft
        organization_type: commercial
        official_url: https://www.microsoft.com
        contact_email:
        based_in: United States
        active_since:
        notes: Microsoft publishes the underlying Azure IP range data as a weekly-updated
          JSON file (Service Tags) at Microsoft's download centre. The MISP project
          converts this data into warninglist format via generate-microsoft-azure.py.
      derivation:
        type: derivative
        description: The list is produced by a Python script (generate-microsoft-azure.py)
          that downloads Microsoft's officially published Azure Service Tags JSON
          file from Microsoft's download centre. The script parses the JSON, extracts
          all address prefixes from the values[*].properties.addressPrefixes structure,
          consolidates overlapping CIDR ranges, and writes the resulting list as a
          MISP-format JSON file. The script is invoked by generate_all.sh along with
          dozens of other warninglist generators. No other IP feeds are consumed as
          inputs.
        source_feeds: []
      listing_policy:
        summary: Entries are not threat indicators — they are known cloud-provider
          infrastructure addresses. An IP is listed when it falls within a CIDR range
          published by Microsoft in the official Azure Service Tags JSON file. The
          list covers all Azure public-datacenter IP ranges globally, including both
          IPv4 and IPv6 blocks. No threat scoring, reputation weighting, or abuse-report
          threshold is applied; the presence in Microsoft's published data is the
          sole criterion.
        criteria:
        - IP falls within a CIDR range published by Microsoft in the official Azure
          Service Tags JSON file
        - Both IPv4 and IPv6 Azure datacenter CIDR blocks are included
        - No minimum abuse threshold or threat score is applied — Microsoft's published
          ranges are the source of truth
      unlisting_policy:
        summary: Because the list is a direct derivative of Microsoft's published
          IP ranges, removals are not made at the MISP layer — an IP would be removed
          only if Microsoft removes it from the official Service Tags JSON. Entries
          are regenerated when the list is rebuilt from Microsoft's updated data.
          There is no independent MISP-layer abuse threshold or manual review process
          for removing entries.
        criteria:
        - Microsoft removes the CIDR range from the official Azure Service Tags JSON
        - The MISP list is regenerated from the updated Microsoft data
      unlist_request:
        url:
        email:
        instructions: Unlisting requests are not applicable at the MISP layer for
          this feed. Because the list is a direct derivative of Microsoft's published
          Azure IP ranges, an IP can only be unlisted by Microsoft removing it from
          the official Service Tags JSON. If an Azure IP is causing false-positive
          alerts in a MISP deployment, the recommended approach is to configure MISP's
          warninglist settings to disable or filter this list, or to file a request
          with Microsoft to exclude the IP from future Service Tags publications.
          Community members may also open a GitHub issue on the MISP/misp-warninglists
          repository to propose enhancements such as regional subdivisions.
      update_frequency:
        frequency:
        human_readable: Regenerated when the MISP project maintainers rebuild the
          warninglists from Microsoft's updated Service Tags JSON. Microsoft publishes
          updated Service Tags weekly; the MISP project does not state a fixed regeneration
          cadence.
      detection_classification:
        primary_method: policy_assignment
        secondary_methods: []
        description: "This is not a threat-detection feed. The list is a policy-assignment
          list: entries are assigned to the list because Microsoft has published them
          as Azure datacenter IP ranges. No honeypot, sandbox, sensor network, community
          reports, or active scanning contributes to this list. The sole input is
          Microsoft's officially published Service Tags JSON file, processed by a
          Python script that extracts and consolidates CIDR ranges."
      scope_and_intent:
        description: The list flags connections from known Microsoft Azure public
          cloud infrastructure as informational events rather than threats. It is
          designed to suppress false positives in threat-intelligence pipelines when
          analysts encounter benign cloud-provider egress traffic.
        intended_for:
        - False-positive suppression in MISP threat-intelligence workflows
        - Flagging Azure datacenter IPs as known cloud-provider infrastructure in
          security analytics
        - Enriching MISP events with contextual information about Azure-hosted sources
        not_intended_for:
        - Blocking or blacklisting Azure IP ranges at the network perimeter
        - Threat-indicator enrichment (the list contains no malice assessments)
        - Detecting malicious activity originating from Azure infrastructure
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 Universal dedicates the work to the public domain worldwide.
          Anyone may copy, distribute, modify, perform, or make commercial use of
          the work without permission or attribution required.
      current_status:
        state: active
        description: Active. The list is maintained in the MISP/misp-warninglists
          repository. The latest commit to the azure list was December 3, 2024, by
          contributor adulau. The project continues regular maintenance of all warninglists.
        successor:
        announcement_date:
      community:
        awards:
        criticism: "A community member opened GitHub issue #261 in February 2024 reporting
          that Azure datacenter IPs were generating what appeared to be massive inbound
          scan activity, and requested that the list be subdivided by region (specifically
          citing Indian Azure IP subranges) or that specific subnets be excluded.
          The maintainer applied an 'enhancement' label in March 2025 but the issue
          remains open and unresolved with no committed fix or workaround. This reflects
          a known gap between the list's broad coverage of all Azure datacenter ranges
          and operators who need finer-grained regional distinctions."
        engagement: 'Public discussion specifically about the microsoft-azure list
          is sparse. GitHub issue #261 is the only notable public discussion specifically
          about this list. The MISP/misp-warninglists parent repository has accumulated
          625 stars and 190 forks (as of May 2026).'
