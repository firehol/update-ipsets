    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: provider_infrastructure
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Gmail sending
      IP ranges. Mail-provider infrastructure reference, not a threat indicator.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-19T06:35:56Z'
      official_name: List of known Gmail sending IP ranges
      official_url: https://github.com/MISP/misp-warninglists
      short_description: Dynamically generated reference list of IP ranges used by
        Gmail for sending outbound mail, sourced from Google's published SPF DNS records
        and formatted as CIDR blocks for MISP attribute matching.
      long_description: "The MISP Project maintains this list as part of the misp-warninglists
        collection, a set of well-known indicators published to help security analysts
        distinguish legitimate infrastructure from suspicious activity during threat
        intelligence analysis. Rather than tracking threats, the list documents the
        IP address space Google uses to send outbound mail from Gmail — sourced directly
        from Google's published Sender Policy Framework (SPF) DNS records for gmail.com.\n\
        \nThe list is generated programmatically by a Python script that queries gmail.com's
        SPF TXT record, recursively resolves all included networks (_spf.google.com
        and related directives), resolves A/AAAA records for listed domains and mail
        exchangers, then collapses overlapping and adjacent CIDR ranges into a consolidated
        set. The output is a JSON file compatible with MISP's warning list format,
        matching against ip-src, ip-dst, domain|ip, ip-src|port, and ip-dst|port attribute
        types.\n\nPer the maintainer's documentation, warning lists are integrated
        into MISP to display an informational or warning box at the event and attribute
        levels whenever a matching indicator is found. They can be enabled or disabled
        globally depending on an organization's practices. The list is licensed under
        CC0 1.0 Universal (Public Domain Dedication)."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: research_institution
        official_url: https://github.com/MISP
        contact_email:
        based_in:
        active_since: '2019'
        notes: "The MISP Project (Computer Incident Response Center Luxembourg, CIRCL)
          develops and maintains the misp-warninglists repository. Individual contributors
          are credited via GitHub commit history. The google-gmail-sending-ips list
          was introduced in PR #112 by elhoim (July 2019) and later updated by JakubOnderka
          with the automated generator script (June 2021). Recent commits carry the
          author tag 'adulau' (Alexandre Dulaunoy, CIRCL)."
      derivation:
        type: original
        description: "The list is generated by a Python script that queries the SPF
          TXT DNS record for gmail.com, recursively resolves all include: directives
          (such as _spf.google.com), resolves A/AAAA records for domains and mail
          exchanger hosts listed in the SPF record, then consolidates the resulting
          IP ranges using Python's ipaddress.collapse_addresses() — splitting by IP
          version, collapsing overlapping or adjacent CIDRs, deduplicating, and sorting.
          The output is written to list.json as a MISP-compatible warning list. The
          DNS resolver uses configured CZ.NIC nameservers with a 30-second timeout.
          No other IP feeds are consumed as inputs."
        source_feeds: []
      listing_policy:
        summary: Entries are not individually listed or unlisted — the list is a complete
          snapshot of Gmail's current SPF-derived sending IP space, regenerated by
          running the generator script. Because the source is Google's live SPF DNS
          records for gmail.com, the list contents change whenever Google's mail infrastructure
          changes. There is no manual submission, review, or approval process.
        criteria:
        - Any IPv4 or IPv6 CIDR range currently published in gmail.com's SPF TXT DNS
          record is included
        - Ranges are consolidated by collapsing overlapping or adjacent networks
        - No manual additions or removals are made — the list is a programmatic reflection
          of Google's published SPF data
      unlisting_policy:
        summary: Because the list is a mechanical reflection of Google's live SPF
          records rather than a manually curated blocklist, there is no traditional
          unlisting process. If an IP range is no longer in gmail.com's SPF record,
          it will not appear in the next generated list. No manual removal requests
          are applicable.
        criteria:
        - IP ranges absent from gmail.com's SPF TXT record are omitted from the next
          generated list
        - No manual delisting channel is offered — the list is a passive reference,
          not an active blocklist
      unlist_request:
      update_frequency:
        frequency:
        human_readable: Regenerated on demand by running the generator script; no
          stated scheduled cadence
      detection_classification:
        primary_method: policy_assignment
        secondary_methods: []
        description: "The list is produced by querying gmail.com's SPF TXT DNS record
          and recursively resolving all included networks, then consolidating the
          resulting IP ranges. This is a policy-assignment approach: the entries represent
          Google's officially designated mail-sending address space, not detections
          of malicious activity. The list is used to identify IPs belonging to Google's
          legitimate outbound mail infrastructure so they can be recognized as benign
          during threat intelligence analysis."
      scope_and_intent:
        description: The list identifies IP address ranges used by Gmail to send outbound
          mail. It is intended as a reference to help analysts recognize when a detected
          IP belongs to Google's legitimate mail-sending infrastructure, preventing
          it from being falsely flagged as a threat indicator.
        intended_for:
        - False-positive suppression during MISP threat intelligence analysis
        - Identifying Gmail sending infrastructure in event attributes
        - Allowlisting Gmail sending IPs in SIEM or detection pipelines
        not_intended_for:
        - Blocking or denying traffic — the list is informational, not a blocklist
        - Threat indicator enforcement — entries represent legitimate infrastructure,
          not malicious activity
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 Universal Public Domain Dedication — no conditions imposed.
          The licensor dedicates the work to the public domain to the fullest extent
          permitted by law, without warranty of any kind.
      current_status:
        state: active
        description: Actively maintained. The list.json carried version 20260428 as
          of April 28, 2026, indicating a recent regeneration. The generator script
          remains present and functional in the repository. No discontinuation or
          migration notice has been issued by the maintainer.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public community discussion specifically mentioning the google-gmail-sending-ips
          list is sparse. The list is referenced in general MISP warninglists discussions
          on Reddit and professional security forums, where users ask about using
          vendor IP ranges for false-positive suppression. No documented complaints,
          false-positive reports, or community issues specifically targeting this
          list were found across GitHub issues, pull requests, changelog history,
          or security blog posts. The list has operated without reported incident
          since its introduction in July 2019.
