        document_date: '2017-11-17'
        validation_date: '2026-05-21'
      - url: 
          https://www.reddit.com/r/Cisco/comments/snz7nx/firepower_blocking_apple_updates_outbound_reason/
        document_date: '2022-02-09'
        validation_date: '2026-05-21'
      - url: https://www.edugeek.net/forums/topic/208032-apple-ip-addresses/
        document_date: '2022-05-27'
        validation_date: '2026-05-21'
      - url: https://www.apple.com/legal/intellectual-property/guidelinesfor3rdparties.html
        document_date:
        validation_date: '2026-05-21'
