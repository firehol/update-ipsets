  misp_smtp_receiving_ips:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/smtp-receiving-ips/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: provider_infrastructure
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) known SMTP
      receiving IP addresses. Mail infrastructure reference, not a threat indicator.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T17:58:50Z'
      official_name: List of known SMTP receiving IP addresses
      official_url: https://github.com/MISP/misp-warninglists
      short_description: Auto-generated list of IP addresses belonging to mail exchange
        (MX) servers for known email domains, maintained as a MISP warning list to
        distinguish legitimate inbound mail infrastructure from direct-to-mailer malware.
      long_description: "The smtp-receiving-ips warninglist catalogs IP addresses
        belonging to mail exchange (MX) servers for known email domains — the inbound
        mail gateway addresses of major email service providers worldwide.\n\nPer
        the maintainer's generator script (tools/generate-smtp.py), the list is produced
        by resolving the DNS MX records for a curated set of popular email domains
        spanning global providers (Gmail, Yahoo, Outlook/iCloud, ProtonMail, Yandex,
        and regional ISPs across North America, Europe, Asia, and South America).
        Entries cover both IPv4 and IPv6.\n\nThe list is regenerated automatically
        from live DNS data on a periodic schedule; individual IPs enter and leave
        as upstream MX records change. No manual per-IP curation workflow exists.
        The list is formatted for MISP's CIDR-matching engine, matching against ip-src,
        ip-dst, domain|ip, and port-variant attributes during analyst workflows."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: informal_collective
        official_url: https://misp-project.org/
        contact_email: mps@misp-project.org
        based_in: Luxembourg
        active_since:
        notes: The MISP Project develops and maintains the MISP threat intelligence
          platform and its associated warning lists, galaxies, and taxonomies. Training
          and operational support is provided by CIRCL (Centre for Information Security,
          Luxembourg).
      - role: publisher
        name: adulau
        organization_type: individual
        official_url: https://github.com/adulau
        contact_email:
        based_in:
        active_since:
        notes: The GitHub account credited with the most recent commits to the smtp-receiving-ips
          list (commit 9397afe, April 2026).
      derivation:
        type: original
        description: The list is generated by an automated Python script (tools/generate-smtp.py)
          that resolves DNS MX records for a curated set of popular email domains
          spanning global providers (Gmail, Yahoo, Outlook, iCloud, ProtonMail, Yandex,
          and regional ISPs across North America, Europe, Asia, Latin America, and
          Russia). For each domain, the script queries MX records and resolves the
          corresponding A and AAAA records to collect IP addresses; DNS lookups are
          parallelised. The resulting IPs are written to the list.json file without
          manual filtering or threshold scoring. No external IP feeds, commercial
          threat intelligence sources, or community reports are consumed — the sole
          input is live DNS zone data.
        source_feeds: []
      listing_policy:
        summary: An IP is listed when it appears as the address of a mail exchange
          (MX) host for one of the curated email domains in the generator script.
          The maintainer does not apply manual review, scoring thresholds, or abuse-report
          filtering to individual entries — inclusion is determined solely by successful
          DNS MX resolution.
        criteria:
        - The IP must respond as an A or AAAA record for an MX hostname of a curated
          email domain
        - The domain must be present in the hardcoded domain list in tools/generate-smtp.py
          (~80 domains globally)
      unlisting_policy:
        summary: Because the list is regenerated automatically from live DNS data,
          there is no manual per-IP unlisting mechanism. IPs are implicitly unlisted
          when they no longer appear in upstream MX records. The maintainer does not
          publish a manual removal request channel for this list.
        criteria:
        - 'Automatic: an IP leaves the list when it is no longer returned as an MX
          target for any curated domain'
        - No manual removal process is documented for this list
      unlist_request:
      update_frequency:
        frequency: 1d
        human_readable: Regenerated daily, per the maintainer's stated update cadence
          in the catalog YAML (1440 minutes)
      detection_classification:
        primary_method: active_scanning
        secondary_methods: []
        description: 'The list is produced by active DNS queries: the generator script
          sends MX record lookups and subsequent A/AAAA record resolutions for a curated
          set of popular email domains. This is active probing of DNS infrastructure,
          not passive observation, honeypot captures, or user submissions.'
      scope_and_intent:
        description: The list marks IPs belonging to legitimate, known SMTP receiving
          infrastructure so that analysts can distinguish intentional delivery to
          real mail gateways from direct-to-mailer malware that bypasses normal MTA
          infrastructure.
        intended_for:
        - False-positive suppression during email-related threat intelligence analysis
          in MISP
        - Detecting direct-to-MTA malware that bypasses normal mail submission paths
        - Correlating SMTP traffic patterns during incident response
        not_intended_for:
        - Blocking or filtering inbound mail (this is not a spam blocklist)
        - Threat indicator enrichment (IPs here are not malicious)
        - Security enforcement at network perimeter
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 grants unlimited redistribution and commercial use without
          requiring attribution or prior permission. The licensor disclaims all warranties.
      current_status:
        state: active
        description: Actively maintained. The list received an automated update on
          April 28, 2026 (commit 9397afe by adulau). The MISP Project continues active
          development with recent releases (MISP v2.5.37, April 2026). No discontinuation
          or migration notices have been announced.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public discussion is sparse. No GitHub issues or pull requests
          specifically targeting smtp-receiving-ips were found. One open issue (#300)
          concerns the related smtp-sending-ips list (Aruba IPs missing), but no equivalent
          request exists for smtp-receiving-ips. The list is consumed primarily within
          MISP instances and indirectly through downstream integrators; no standalone
          community forum or mailing-list thread was identified.
