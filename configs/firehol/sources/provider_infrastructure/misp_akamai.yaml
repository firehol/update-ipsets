sources:
  misp_akamai:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/akamai/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: provider_infrastructure
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Akamai IP
      ranges. Provider infrastructure reference, not a threat indicator.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T14:40:49Z'
      official_name: List of known Akamai IP ranges
      official_url: https://github.com/MISP/misp-warninglists
      short_description: A reference list of Akamai IP address ranges, sourced from
        BGP routing data, used to flag CDN infrastructure as a potential false positive
        in threat intelligence.
      long_description: "The akamai warninglist is a CIDR list of IP address ranges
        announced by autonomous systems operated by Akamai Technologies, scoped to
        its CDN and security-service infrastructure. Per the generator script (tools/generate-akamai.py),
        the list is produced by querying a BGP routing database for ASNs and prefixes
        associated with Akamai, then validating each candidate against two criteria:
        the ASN name begins with \"AKAMAI\" and at least one listed abuse contact
        ends in \"@akamai.com\". All IPv4 and IPv6 prefixes announced by qualifying
        ASNs are collected, deduplicated, and consolidated into CIDR notation.\n\n\
        The list matches against ip-src, ip-dst, domain|ip, ip-src|port, and ip-dst|port
        attributes in MISP events. Its purpose is informational — flagging Akamai
        CDN ranges so analysts can recognise observed connections as CDN traffic rather
        than acting on them as novel threats. The list file has not been regenerated
        since April 2024; the generator script depends on the bgpview.io API, which
        was permanently shut down on November 26, 2025 (documented in GitHub Issue
        #318). A replacement API (bgp.tools) has been proposed but no fix has been
        merged."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: non_profit
        official_url: https://github.com/MISP
        contact_email: misp@circl.lu
        based_in: Luxembourg
        active_since:
        notes: 'The MISP Project develops and maintains the Malware Information Sharing
          Platform and its associated warninglists collection. De facto maintenance
          of the akamai list is performed by Alexandre Dulaunoy (GitHub: adulau),
          founder of the MISP Project and operator of CIRCL.lu, who reviews and merges
          all contributions to the repository.'
      derivation:
        type: extraction
        description: The list is generated by querying a BGP routing database API
          for ASNs and IP prefixes associated with Akamai. The generator script searches
          for records matching "AKAMAI", validates each result by checking that the
          ASN name starts with "AKAMAI" and that at least one abuse contact ends in
          "@akamai.com", then collects all IPv4 and IPv6 prefixes announced by qualifying
          ASNs. Overlapping ranges are consolidated before publication. The generator
          script depends on the bgpview.io API, which was permanently shut down on
          November 26, 2025; a replacement API (bgp.tools) has been proposed in the
          repository's issue tracker but no migration has been implemented.
        source_feeds: []
      listing_policy:
        summary: An IP or CIDR range is listed if it is announced by an ASN whose
          name begins with "AKAMAI" and whose registered abuse contact email address
          ends in "@akamai.com". Both conditions must be satisfied. The list covers
          both IPv4 and IPv6 prefixes announced by qualifying ASNs.
        criteria:
        - The ASN name in the BGP routing database starts with the string "AKAMAI"
        - At least one abuse contact email associated with the ASN ends in "@akamai.com"
        - Both conditions must be met; either condition alone is insufficient
        - All IPv4 and IPv6 prefixes announced by qualifying ASNs are included
      unlisting_policy:
        summary: 'There is no automated unlisting or decay mechanism. Removals are
          handled through the standard MISP warninglists contribution workflow: a
          contributor submits a pull request modifying the list.json file, and the
          maintainer reviews and merges the change.'
        criteria:
        - No automatic expiration or time-based removal
        - Removals are processed manually via GitHub pull request
        - Changes require maintainer review and merge
      unlist_request:
        url:
        email:
        instructions: Requests to modify or remove specific entries from the akamai
          list are handled through the standard MISP warninglists GitHub pull-request
          workflow. Contributors fork the repository, edit lists/akamai/list.json
          directly, increment the version number, and submit a pull request for maintainer
          review. There is no dedicated unlisting form or email address specific to
          the akamai list.
      update_frequency:
        frequency:
        human_readable: No fixed update schedule; the list is refreshed ad hoc when
          the generator script is re-run or when a contributor submits an updated
          list.json file.
      detection_classification:
        primary_method: policy_assignment
        secondary_methods: []
        description: 'The list is not a threat indicator feed. It is a policy-assignment
          reference list: IP ranges are included based on a deterministic rule applied
          to BGP routing registry data (ASN name and abuse contact domain), not based
          on observed malicious activity. Entries represent known Akamai CDN infrastructure,
          not indicators of compromise.'
      scope_and_intent:
        description: The akamai list is a false-positive identification tool for MISP
          users. Its purpose is to warn analysts when an IP address in a threat intelligence
          event belongs to Akamai's CDN infrastructure, indicating the IP is likely
          legitimate traffic from a content delivery or security service rather than
          a malicious source.
        intended_for:
        - Flagging Akamai CDN IPs as potential false positives in MISP threat intelligence
          events
        - Filtering Akamai infrastructure from automated threat intelligence correlation
          pipelines
        - Enriching analyst investigations with provider context
        not_intended_for:
        - Blocking or deny-listing Akamai IP ranges
        - Treating Akamai IPs as indicators of malicious activity
        - Threat detection or alerting on Akamai-sourced connections
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 Public Domain Dedication imposes no restrictions; the data
          may be freely used, copied, modified, and redistributed for any purpose
          without attribution requirements.
      current_status:
        state: altered_scope
        description: "The akamai list file remains accessible and unchanged since
          April 22, 2024. The generator script that produces it is non-functional:
          the bgpview.io API it depends on was permanently shut down on November 26,
          2025. A GitHub issue (Issue #318) proposing bgp.tools as a replacement API
          was opened on December 9, 2025, but remains open with no assignees or pull
          requests as of extraction. The list file is usable as-is but may contain
          stale data reflecting Akamai's IP space as of early 2024."
        successor:
        announcement_date: '2025-12-09'
      community:
        awards:
        criticism:
        engagement: 'Public community discussion specifically about the akamai warninglist
          is sparse. The broader misp-warninglists project has moderate adoption —
          the repository has accumulated an estimated 620+ stars and 190 forks on
          GitHub (as of May 2026) — and is integrated into MISP instances, the standalone
          misp-feedback API project, and third-party SIEM and SOAR platforms. The
          akamai list itself generates minimal public discussion; no GitHub issues,
          pull requests, or forum posts focused exclusively on it were found. The
          generator breakage (bgpview.io shutdown) was reported by a community member
          (2xyo) via GitHub Issue #318 on December 9, 2025, with no maintainer response
          recorded as of extraction.'
      sources_consulted:
      - url: https://github.com/MISP/misp-warninglists
        document_date:
        validation_date: '2026-05-18T14:30:00Z'
