sources:
  misp_microsoft_office365_cn:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/microsoft-office365-cn/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: provider_infrastructure
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Office 365
      IP address ranges in China. Provider infrastructure reference, not a threat
      indicator.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T17:21:37Z'
      official_name: List of known Office 365 IP address ranges in China
      official_url: https://github.com/MISP/misp-warninglists
      short_description: MISP warning list of IP address ranges allocated to Microsoft's
        Office 365 service operated by 21Vianet in China, for suppressing false positives
        when analyzing Office 365 traffic.
      long_description: "This warning list identifies IP address ranges allocated
        to Microsoft's Office 365 infrastructure in China, operated by 21Vianet under
        the \"Microsoft 365 operated by 21Vianet\" instance designation. The list
        is formatted as CIDR ranges (both IPv4 and IPv6) and is integrated into MISP
        to display a warning box when an analyst encounters network indicators matching
        these ranges — signaling that the traffic may originate from legitimate Microsoft
        infrastructure rather than representing a threat.\n\nPer the MISP warninglists
        project README, warning lists serve a false-positive suppression role: they
        inform MISP users when detected indicators can be associated with well-known,
        benign infrastructure such as cloud providers, CDN ranges, or scanning/research
        networks. The list is not a threat indicator feed; it marks known-good provider
        infrastructure.\n\nThe list is generated by a Python script that queries Microsoft's
        unified endpoints API at endpoints.office.com/endpoints/China, consolidates
        the returned IP ranges, and writes them to the list.json file. The previous
        generation approach relied on a now-discontinued Microsoft XML endpoint; PR
        #188 replaced it with the current API-driven approach in June 2021. The list
        covers services including Exchange Online, Microsoft Teams, SharePoint Online,
        and Microsoft 365 Common across the China instance."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: research_institution
        official_url: https://github.com/MISP
        contact_email:
        based_in: Luxembourg
        active_since: '2016'
        notes: The MISP Project develops and maintains the MISP threat intelligence
          platform and its companion projects, including the misp-warninglists collection.
          The project is governed by CIRCL (Computer Incident Response Center Luxembourg)
          and operates under an interlocked contributor license model. Key contributors
          include Andras Iklody and Alexandre Dulaunoy.
      derivation:
        type: derivative
        description: "The list is generated by a Python script that queries Microsoft's
          unified Office 365 endpoints API for the China instance (endpoints.office.com/endpoints/China),
          extracts all IP address ranges from the returned JSON payload, consolidates
          overlapping CIDR ranges, and writes the resulting list to list.json. The
          script replaces an earlier approach that scraped a now-discontinued Microsoft
          XML file; PR #188 migrated the generation method in June 2021. No other
          IP feeds are consumed as inputs."
        source_feeds: []
      listing_policy:
        summary: Entries represent IP address ranges Microsoft publishes for its Office
          365 infrastructure in the China instance via its endpoints API. Any range
          present in the Microsoft API response for the China instance is included
          in the list; there is no separate MISP-community review step. Listings persist
          until the next regeneration run detects that Microsoft has removed or changed
          the range.
        criteria:
        - IP or CIDR range appears in the Microsoft endpoints.office.com/endpoints/China
          API response
        - Range is associated with a service area in the China instance (Exchange
          Online, Microsoft Teams, SharePoint Online, Microsoft 365 Common, or related
          components)
      unlisting_policy:
        summary: There is no standing auto-decay or manual review process. An IP range
          leaves the list when Microsoft removes it from the China endpoints API response
          and the list is regenerated — or when a contributor submits a pull request
          correcting an erroneous entry.
        criteria:
        - Microsoft removes the range from its endpoints.office.com/endpoints/China
          API response
        - A contributor identifies an erroneously included range and submits a corrective
          pull request
      unlist_request:
        url: https://github.com/MISP/misp-warninglists/issues/new
        email:
        instructions: Open a GitHub issue at the misp-warninglists repository describing
          the incorrectly listed IP range and the reason it should be corrected. Alternatively,
          submit a pull request with the revised list.json. There is no dedicated
          unlisting form; the standard GitHub issue tracker serves for corrections
          and deprecation requests.
      update_frequency:
        frequency: 1d
        human_readable: Regenerated daily, per the catalog configuration; the list
          is rebuilt by querying Microsoft's endpoints API whenever the generation
          script is run
      detection_classification:
        primary_method: commercial_threat_intel
        secondary_methods: []
        description: The list is not built from threat detection. It is an extraction
          of authoritative infrastructure data published by Microsoft for the China
          instance of Office 365. The generator script queries Microsoft's endpoints.office.com/endpoints/China
          REST API and copies all returned IP ranges into the warning list format.
          This is classified as commercial-threat-intel-derived because the source
          is a commercial cloud provider's publicly documented infrastructure endpoint.
      scope_and_intent:
        description: The list marks IP address ranges belonging to Microsoft's Office
          365 infrastructure in China, operated by 21Vianet. Its purpose is to prevent
          analysts from generating false-positive threat reports when observing network
          activity to or from these ranges during incident investigation or threat
          hunting.
        intended_for:
        - Suppressing false positives in MISP when analyzing Office 365 traffic in
          China
        - Whitelisting known Microsoft infrastructure in security monitoring pipelines
        - Enriching incident context with provider infrastructure awareness
        not_intended_for:
        - Blocking or deny-listing Microsoft Office 365 infrastructure
        - Threat indicator enrichment for attacker infrastructure profiling
        - General-purpose IP reputation scoring
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 Universal Public Domain Dedication imposes no conditions on
          redistribution or commercial use. The data may be freely copied, modified,
          and redistributed by anyone.
      current_status:
        state: active
        description: "Actively maintained as of the catalog's last observed update.
          The list was refreshed in June 2021 via PR #188, migrating the generation
          script to Microsoft's unified endpoints API. An open deprecation issue (#155,
          filed July 2020) remains unresolved — the issue proposed removing the list
          after Microsoft's legacy XML endpoint was discontinued, but the maintainer
          chose to continue the list using the replacement API. The list is served
          from the MISP warninglists GitHub repository."
        successor:
        announcement_date:
      community:
        awards:
        criticism: "An open GitHub issue (#155) filed in July 2020 proposes deprecating
          the list, arguing that Microsoft's consolidated worldwide endpoint list
          supersedes the China-specific feed. The issue has received no maintainer
          response, no labels, and no community comments in approximately six years.
          The list was subsequently refreshed by a community contributor in June 2021
          (PR #188), and the maintainer merged the update without addressing the deprecation
          question. No other notable public complaints or criticisms were found in
          security forums, Reddit, or vendor documentation."
        engagement: 'Public discussion is sparse. Issue #155 is the only tracked community
          thread, with zero comments and zero reactions. PR #188 attracted one acknowledgment
          from the maintainer (adulau). No Reddit posts, blog articles, or vendor
          write-ups were found discussing this specific list. The broader misp-warninglists
          project is widely integrated into MISP deployments and reused by numerous
          open-source security tools; the microsoft-office365-cn variant receives
          minimal standalone attention.'
