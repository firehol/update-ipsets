sources:
  misp_amazon_aws:
    license: CC0 1.0 (MISP warninglists)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/amazon-aws/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: provider_infrastructure
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Amazon AWS
      IP address ranges. Provider infrastructure reference, not a threat indicator.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T14:09:12+00:00'
      official_name: List of known Amazon AWS IP address ranges
      official_url: https://github.com/MISP/misp-warninglists
      short_description: A reference list of Amazon Web Services IP address ranges
        maintained by the MISP project for marking AWS infrastructure in threat intelligence
        data, to reduce false-positive correlations.
      long_description: "The amazon-aws warninglist is a CIDR list enumerating all
        publicly announced Amazon Web Services IP address ranges. It is drawn directly
        from AWS's publicly available IP ranges endpoint (ip-ranges.amazonaws.com/ip-ranges.json),
        with entries processed into CIDR notation and formatted as a MISP warninglist
        JSON file.\n\nThe list carries a version string using a date-based format
        (YYYYMMDD). Entries are matched against ip-src, ip-dst, domain|ip, ip-src|port,
        and ip-dst|port attribute types. Because the list is sourced from AWS's own
        published allocation data, it reflects the state of AWS infrastructure as
        AWS announces it — no independent threat detection is performed and additions
        or retirements track AWS's own publication."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: research_institution
        official_url: https://www.misp-project.org/
        contact_email: misp@circl.lu
        based_in: Luxembourg
        active_since: '2012'
        notes: The MISP project develops and maintains the MISP threat intelligence
          platform and its companion datasets, including warning lists. Core contributors
          include researchers affiliated with CIRCL (Computer Incident Response Center
          Luxembourg). The project was founded in 2012 with contributions from Belgian
          Defence and NATO NCIRC.
      - role: publisher
        name: CIRCL
        organization_type: research_institution
        official_url: https://www.circl.lu/
        contact_email: misp@circl.lu
        based_in: Luxembourg
        active_since: '2012'
        notes: CIRCL (Computer Incident Response Center Luxembourg) is a primary long-term
          contributor and copyright holder for the MISP project, providing institutional
          backing for the warninglists repository.
      derivation:
        type: derivative
        description: The list is generated by extracting CIDR-prefixed IP address
          ranges from AWS's publicly available IP ranges endpoint (ip-ranges.amazonaws.com/ip-ranges.json).
          AWS publishes this JSON file as its authoritative record of allocated Elastic
          Compute Cloud (EC2) and other service IP prefixes, updated whenever AWS
          adds or decommissions infrastructure. The MISP warninglists repository processes
          this source file using jq to extract and format entries into the warning
          list JSON structure. No independent threat detection, honeypot data, or
          third-party feeds are involved — the list is a direct transformation of
          AWS's own published allocation data.
        source_feeds: []
      listing_policy:
        summary: Entries are determined entirely by AWS's publicly announced IP address
          allocations. Any CIDR range that appears in AWS's ip-ranges.json file is
          included. No manual review, threat scoring, or community reporting affects
          the list — it is a mechanical reflection of AWS's published infrastructure
          ranges.
        criteria:
        - The IP range must appear in AWS's publicly available ip-ranges.json endpoint
        - The range must represent an AWS-owned allocation (service field set to AMAZON
          or another AWS service)
      unlisting_policy:
        summary: Because the list is a direct reflection of AWS's publicly announced
          IP allocations, removals are not applicable in the conventional sense. If
          AWS retires an allocation, it will disappear from the upstream source and
          consequently from the warning list upon regeneration. There is no manual
          delisting process.
        criteria:
        - Removals follow automatically from changes in AWS's published IP ranges
          — no manual removal requests are processed
      unlist_request:
      update_frequency:
        frequency: 1d
        human_readable: Regenerated daily, reflecting updates published by AWS to
          its IP ranges endpoint
      detection_classification:
        primary_method: policy_assignment
        secondary_methods: []
        description: "The list is not a threat indicator feed in the conventional
          sense. It is a provider-infrastructure reference list: every entry represents
          an IP range officially owned and announced by Amazon Web Services. Entries
          are generated by extracting CIDR prefixes from AWS's own published allocation
          data. No honeypots, sensors, malware analysis, or user submissions are involved."
      scope_and_intent:
        description: The list is scoped to all publicly announced Amazon Web Services
          IP address ranges, covering EC2, Lambda, and other AWS services. It is intended
          as a false-positive suppressor in threat intelligence workflows, not a threat
          indicator source.
        intended_for:
        - Marking AWS-hosted infrastructure in MISP events to suppress false-positive
          alerts
        - Filtering MISP attribute-level lookups to exclude known AWS infrastructure
        - Reference in SIEM and ticketing systems where AWS-owned IPs appear in logs
        not_intended_for:
        - Blocking or blacklisting AWS IP ranges (the ranges include legitimate customer-facing
          services)
        - Threat indicator enrichment (AWS-owned IPs are not inherently malicious)
      license: CC0 1.0 Universal (CC0 1.0) — Public Domain Dedication
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 Public Domain Dedication places the work in the public domain,
          waiving all rights worldwide under copyright law including rights to attribution.
          The maintainer notes that if a specific author wishes to apply a different
          license to their warning list, a pull request can be submitted.
      current_status:
        state: active
        description: Active. The MISP warninglists repository is actively maintained
          with regular releases. The most recent release (tag 2026040500) was published
          on 5 April 2026 and included updates to multiple warning lists including
          amazon-aws. The project is hosted by CIRCL in Luxembourg.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: 'Public discussion of the amazon-aws warning list specifically
          is sparse. The MISP warninglists repository overall receives regular community
          contributions: the April 2026 release noted 21 new contributors. The repository
          is integrated into the MISP core platform and reused by numerous open-source
          security projects as a false-positive suppression reference. Community engagement
          takes the form of GitHub pull requests updating individual lists rather
          than public forum discussion.'
      sources_consulted:
