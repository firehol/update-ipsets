sources:
  misp_tenable_cloud:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/tenable-cloud-ipv4/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: provider_infrastructure
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Tenable
      Cloud Sensor scanner IP ranges. Commercial vulnerability scanning infrastructure
      — informational, not for blocking.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T18:26:43+00:00'
      official_name: List of known Tenable Cloud Sensors IPv4
      official_url: https://github.com/MISP/misp-warninglists
      short_description: IP ranges belonging to Tenable.io cloud-hosted vulnerability
        scanners, enabling operators to identify inbound scans from known commercial
        scanning infrastructure and suppress false-positive alerts.
      long_description: "The tenable-cloud-ipv4 warninglist identifies IP address
        ranges allocated to Tenable.io cloud-hosted vulnerability scanning sensors.
        Organizations using Tenable.io to scan their internet-facing infrastructure
        commonly encounter detections triggered by inbound scans from these sensor
        IPs — adding these ranges to the warninglist allows security teams to recognize
        Tenable.io as the scanning source and suppress false-positive incident creation.\n\
        \nThe list is generated by a Python script (tools/generate-tenable.py) that
        fetches Tenable's official IP ranges JSON endpoint and extracts the IPv4 CIDR
        blocks; a companion list (tenable-cloud-ipv6) is generated from the same source.
        The list is informational only: it advises the analyst rather than driving
        automated blocking. Coverage is limited to Tenable's cloud-hosted sensor ranges
        — on-premises Tenable sensor appliances are not included."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: research_institution
        official_url: https://github.com/MISP
        contact_email: misp@circl.lu
        based_in: Luxembourg
        active_since: '2012'
        notes: The MISP Project is an open-source threat intelligence platform and
          standards effort hosted at CIRCL.lu, the Luxembourgish Computer Incident
          Response Center. The project maintains the misp-warninglists repository
          and reviews contributions via GitHub pull requests.
      - role: source_contributor
        name: jberkers42
        organization_type: individual
        official_url: https://github.com/jberkers42
        contact_email:
        based_in:
        active_since: '2022'
        notes: 'Community contributor who opened the feature request (GitHub Issue
          #225) and submitted the generator script (PR #226) and documentation updates
          (PR #227) in October 2022. The contribution was reviewed and merged by MISP
          Project maintainer @adulau within approximately 22 hours.'
      derivation:
        type: original
        description: The tenable-cloud-ipv4 warninglist is generated by a Python script
          (tools/generate-tenable.py) that fetches the authoritative IP range data
          from Tenable's official public JSON endpoint. The script processes the 'prefixes'
          array from Tenable's response, extracting IPv4 CIDR blocks into the warninglist
          JSON format. A companion script generates the tenable-cloud-ipv6 variant
          from the same endpoint's 'ipv6_prefixes' array. Both lists carry a date-versioned
          version field (YYYYMMDD format) and are rebuilt by running the generator
          script when Tenable updates its allocations.
        source_feeds: []
      listing_policy:
        summary: Entries are IP address ranges (CIDR blocks) allocated to Tenable.io
          cloud-hosted vulnerability scanning sensors. The list is produced by fetching
          Tenable's officially published IP range inventory. Any IP range published
          by Tenable as a cloud sensor prefix is eligible for inclusion.
        criteria:
        - IP range must be published by Tenable as an active cloud sensor prefix in
          Tenable's official IP ranges endpoint
        - Ranges are included automatically when the generator script is run against
          the latest Tenable data
        - On-premises Tenable sensor appliances are not included — only cloud-hosted
          sensor ranges are covered
      unlisting_policy:
        summary: There is no formal documented unlisting process. MISP warninglists
          are informational annotations — operators enable or disable specific warninglists
          at the local MISP instance level. Removal of an entry from the upstream
          source (Tenable ceasing to use a range) propagates when the generator script
          is re-run.
        criteria:
        - No automatic expiration or decay mechanism is defined for this warninglist
        - Local MISP instances can disable the tenable-cloud-ipv4 warninglist at the
          instance level without affecting other instances
        - Removal of an entry from the upstream source propagates when the generator
          script is re-run
      unlist_request:
        url: https://github.com/MISP/misp-warninglists/issues/new
        email:
        instructions: There is no dedicated unlisting channel for this specific warninglist.
          Operators wishing to request removal of an IP from the tenable-cloud-ipv4
          list should open a GitHub issue on the MISP/misp-warninglists repository
          or submit a pull request modifying the list.json file directly. At the local
          MISP instance level, the warninglist can be disabled entirely via the warninglists
          index page without needing a removal request.
      update_frequency:
        frequency:
        human_readable: Updates are driven by changes in Tenable's published IP range
          inventory rather than a fixed schedule. The generator script is re-run when
          Tenable updates its allocations, producing a new version-tagged list.json.
      detection_classification:
        primary_method: policy_assignment
        secondary_methods: []
        description: The feed consists of IP address ranges assigned by Tenable to
          its cloud-hosted vulnerability scanning infrastructure. These are not malicious
          indicators — they are authoritative allocations belonging to a commercial
          scanning service. The list enables analysts to recognize inbound scans from
          legitimate Tenable.io sensors rather than treating them as hostile activity.
      scope_and_intent:
        description: The warninglist identifies IP address ranges used by Tenable.io
          cloud-hosted vulnerability scanning sensors. Its purpose is to inform security
          analysts when their infrastructure detects inbound scans from these known
          scanning sources, preventing false-positive incident creation.
        intended_for:
        - Suppressing false-positive alerts when Tenable.io scans are detected by
          intrusion detection systems
        - Annotating MISP events containing IPs that resolve to known commercial vulnerability
          scanning infrastructure
        - Filtering MISP attribute exports to exclude known scanning source IPs
        not_intended_for:
        - Blocking or denying network access — the list is explicitly informational,
          not a blocklist
        - Detecting malicious activity — entries represent legitimate commercial scanning
          infrastructure, not threats
        - On-premises Tenable sensor appliances — only cloud-hosted sensor ranges
          are included
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 Universal grants unlimited rights to use, modify, and redistribute
          the content without any conditions. As a public domain dedication, no attribution
          is legally required, though crediting the MISP Project is customary practice
          in the threat intelligence community.
      current_status:
        state: active
        description: Actively maintained as of 2026. The tenable-cloud-ipv4 list carries
          version tag 20260428, indicating the list was regenerated in April 2026.
          No issues or pull requests related to this list have been filed or reopened
          since the initial implementation in October 2022.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public community discussion about the tenable-cloud-ipv4 warninglist
          is sparse. The feature was implemented rapidly (~22 hours from request to
          merge) following a community-submitted issue and pull request in October
          2022. No reopened issues, bug reports, or enhancement requests specific
          to this list were found in the MISP/misp-warninglists issue tracker through
          May 2026. The MISP warninglists ecosystem broadly integrates into security
          operations workflows via PyMISPWarningLists (Python), misp-feedback (Rust),
          and published connectors for platforms including Polarity and OpenCTI.
