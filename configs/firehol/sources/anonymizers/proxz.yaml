        that are tested for quality before being distributed via RSS feed. Proxies
        are categorized into two types: transparent or non-anonymous proxies (which
        reveal the user's IP and indicate proxy usage to destination servers) and
        anonymous or elite proxies (which hide the user's IP and send only limited
        server information). The feed is distributed with a 60-minute TTL, indicating
        refresh recommendations, though the site describes its update cycle as daily."
