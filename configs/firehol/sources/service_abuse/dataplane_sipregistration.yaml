sources:
  dataplane_sipregistration:
    license: Dataplane.org — non-commercial use only, redistribution prohibited
    redistributable: false
    url: https://dataplane.org/sipregistration.txt
    frequency: 60
    ipv: ipv4
    output: ipset
    processor:
    - dataplane_column3
    processor_raw: dataplane_column3
    category: service_abuse
    info: '[DataPlane.org](https://dataplane.org/) IP addresses that have been seen
      initiating a SIP REGISTER operation to a remote host. This report lists hosts
      that are suspicious of more than just port scanning.  These hosts may be SIP
      client cataloging or conducting various forms of telephony abuse.'
    maintainer: DataPlane.org
    maintainer_url: https://dataplane.org/
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-19T01:43:21Z'
      official_name: SIP Registration Signal
      official_url: https://dataplane.org/signals.html
      short_description: IPv4 addresses observed sending SIP REGISTER requests to
        remote hosts, flagging possible SIP client enumeration or telephony abuse
        such as toll fraud probing.
      long_description: "The SIP Registration Signal is produced by DataPlane.org
        NFP, a Chicago-based 501(c)(3) nonprofit founded in 2016 with the stated mission
        \"for operators, by operators.\" The signal is generated by the organization's
        distributed sensor network — described on the about page as over 300 nodes
        across 65 metropolitan areas on 6 continents — passively observing unsolicited
        SIP application-layer communications traversing those nodes.\n\nEach entry
        records an IPv4 address observed sending a SIP REGISTER request to a remote
        host. Per the feed file header, entries are formatted as pipe-separated fields:
        originating ASN, ASN network name, IP address, last-seen timestamp in UTC,
        and the category tag \"sipregistration.\" An IP is listed no more than once
        even when multiple origin AS (MOAS) announcements cover its prefix; entries
        are sorted by originating ASN. The maintainer uses the PyASN IP-to-ASN mapping
        service to resolve origin AS numbers and names.\n\nThe signal is explicitly
        informational. The feed file header carries a disclaimer: \"This report is
        informational. This is not a block list. Deriving malicious or benign intent
        for an individual entry in the face of NATs, address spoofing, and certain
        types of Internet activity (e.g., surveying research) can be difficult. The
        report is provided on an as-is basis with no expressed warranty or guarantee
        of accuracy.\""
      roles:
      - role: maintainer
        name: DataPlane.org NFP
        organization_type: non_profit
        official_url: https://dataplane.org/
        contact_email: info@dataplane.org
        based_in: Chicago, IL, United States
        active_since: '2016'
        notes: A 501(c)(3) nonprofit organization (IRS EIN 882177476) that provides
          free network signals, analysis, and statistics to the Internet's network
          and security communities. Per the about page, the organization began by
          deploying sensors across various networks to observe unsolicited Internet
          application communications. The maintainer's about page also lists downstream
          consumers of the broader signal portfolio (Abuse Helper, IntelMQ, MISP,
          Team Cymru, Shadowserver, and others); this applies across the maintainer's
          feeds rather than to sipregistration alone.
      - role: original_author
        name: John Kristoff
        organization_type: non_profit
        official_url:
        contact_email:
        based_in:
        active_since: '2016'
        notes: Founder of DataPlane.org. Interests in Internet infrastructure with
          a focus on BGP routing, DNS, and internetwork security.
      - role: original_author
        name: Matthew Kemp
        organization_type: non_profit
        official_url:
        contact_email:
        based_in:
        active_since:
        notes: Technologist and leader with experience across various IT functions,
          focused on building unique systems and teams.
      - role: original_author
        name: Bill Eaheart
        organization_type: non_profit
        official_url:
        contact_email:
        based_in:
        active_since:
        notes: Infrastructure architect guided by a collaborative approach for designing
          and delivering solutions.
      derivation:
        type: original
        description: The signal is generated from DataPlane.org's own distributed
          sensor network — described as over 300 nodes across 65 metropolitan areas
          on 6 continents. Sensors passively observe SIP REGISTER operations sent
          to remote hosts from source IPs traversing the network. The maintainer resolves
          each listed IP to its originating autonomous system number and network name
          using the PyASN IP-to-ASN mapping service. Entries are deduplicated so that
          each IP appears no more than once even when multiple origin AS (MOAS) announcements
          cover its prefix.
        source_feeds: []
      listing_policy:
        summary: An IPv4 address is listed when DataPlane.org's distributed sensor
          network observes it sending a SIP REGISTER request to a remote host. Each
          IP appears no more than once regardless of how many origin AS (MOAS) announcements
          cover its prefix; entries are sorted by originating autonomous system number.
        criteria:
        - Observed sending a SIP REGISTER request to a remote host, detected by DataPlane.org's
          distributed sensor network
        - Listed once per IP address, even when multiple origin AS (MOAS) announcements
          cover the covering prefix
      unlisting_policy:
        summary: There is no manual unlisting or removal request process. Per the
          contact page FAQ, an IP address decays from the signal automatically once
          the activity that caused its listing (sending SIP REGISTER operations) is
          no longer observed. Fixing the underlying device issue and ceasing the problematic
          activity is the stated path to removal.
        criteria:
        - Automatic natural decay when SIP REGISTER activity from the IP ceases
        - No formal manual delisting or appeal process is documented
      unlist_request:
        url:
        email: info@dataplane.org
        instructions: No dedicated abuse or unlisting request channel exists. Per
          the contact page FAQ, the recommended course is to remediate the underlying
          device issue causing the SIP REGISTER activity; IPs then decay automatically
          once the activity is no longer observed. General enquiries may be directed
          to info@dataplane.org.
      update_frequency:
        frequency: 1h
        human_readable: Updated hourly, per the maintainer's signals catalog.
      detection_classification:
        primary_method: network_telescope
        secondary_methods: []
        description: Passive network observation via DataPlane.org's distributed sensor
          network. Sensors are deployed across over 300 nodes in 65 metropolitan areas
          on 6 continents to observe unsolicited SIP REGISTER operations traversing
          the network. This is telescope-style passive monitoring — the sensors listen
          on network paths without initiating connections or deploying traditional
          honeypot services with fake SIP endpoints.
      scope_and_intent:
        description: The signal is designed to identify IPv4 addresses engaged in
          SIP client enumeration or telephony abuse activity, specifically the act
          of sending SIP REGISTER requests to remote hosts — a behavior that goes
          beyond simple port scanning. The maintainer explicitly frames the signal
          as informational observation, not a blocklist.
        intended_for:
        - Identifying SIP client enumeration and telephony abuse patterns
        - Network security monitoring and anomaly detection for VoIP infrastructure
        - Informational threat intelligence for security operations teams
        not_intended_for:
        - Inline blocking or deny-listing at network perimeter devices
        - Automated blocking decisions without human review
        - Generating blocklists for firewall or IDS enforcement
      license: Non-commercial use only, redistribution prohibited (per DataPlane.org)
      redistribution:
        allowed: false
        commercial_use_allowed: false
        attribution_required:
        terms: Free for non-commercial use only. Redistribution is not permitted.
          Commercial use requires prior written authorisation — operators should contact
          info@dataplane.org to discuss terms.
      current_status:
        state: active
        description: Active and maintained as of May 2026. The feed file was retrieved
          successfully and contains entries with last-seen timestamps in May 2026.
          The signals catalog page lists the signal with hourly update cadence. No
          discontinuation, merger, or scope-change announcement was found in maintainer-controlled
          documentation.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public community discussion of the SIP Registration signal specifically
          is sparse. A Reddit post announcing the DataPlane.org project launch in
          late 2020 received minimal engagement. Broader community discussion about
          SIP honeypot methodologies exists in security forums, but direct discussion
          about this specific signal was not found in public forums during research.
          Maintainer-wide downstream-consumer context is in roles[].notes.
