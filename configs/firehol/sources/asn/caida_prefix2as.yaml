    info: '[CAIDA RouteViews prefix2as](https://www.caida.org/catalog/datasets/routeviews-prefix2as/)
      — daily IP-to-ASN mapping derived from RouteViews BGP data. Raw data is governed
      by the CAIDA AUA and is not redistributed; only derived per-feed statistics
      are published.'
    license: CAIDA Acceptable Use Agreement
    redistributable: false
    attribution: The CAIDA UCSD Routeviews Prefix-to-AS mappings (pfx2as), https://catalog.caida.org/dataset/routeviews_prefix_to_as_mappings
    maintainer: CAIDA
    maintainer_url: https://www.caida.org/
    hidden: true
    use: [asn]
    format: caida_prefix2as
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-17T19:27:05+00:00'
      official_name: RouteViews Prefix to AS mappings Dataset (pfx2as) for IPv4 and
        IPv6
      official_url: https://www.caida.org/catalog/datasets/routeviews-prefix2as/
      short_description: Daily IPv4 and IPv6 prefix-to-autonomous-system number mappings
        derived from RouteViews BGP routing data, providing a historical record of
        which ASNs have announced which IP prefixes.
      long_description: "The RouteViews Prefix-to-AS mappings dataset provides a daily
        historical record of which autonomous system numbers (ASNs) have announced
        which IP prefixes, covering both IPv4 and IPv6. Per the maintainer's documentation,
        files are generated using a BGP Routing Information Base (RIB) snapshot from
        the RouteViews collector network — selecting the median-sized snapshot available
        each day to avoid truncated or problematic data — and processed into tab-separated
        prefix-to-AS records.\n\nMulti-origin AS (MOAS) prefixes, where more than
        one ASN announces the same prefix, are handled by listing all announcing ASes
        separated by underscores. Since the 2010-10-27 file, ASes within a MOAS entry
        are ordered by descending frequency of appearance as the origin AS in the
        source BGP table, with ties broken alphabetically. The maintainer notes that
        users seeking a single mapping can take the first-listed AS, with full awareness
        of the associated caveats.\n\nThe dataset is designed for use with CAIDA's
        ASFinder tool and CoralReef suite. It is not suitable for real-time security
        decisions — it is a daily snapshot representing a single BGP collector perspective,
        not a complete view of global routing. Files are compatible with CAIDA's ASFinder
        and CoralReef tools including the t2_convert -R option."
      roles:
      - role: maintainer
        name: CAIDA
        organization_type: research_institution
        official_url: https://www.caida.org/
        contact_email: data-info@caida.org
        based_in: United States
        active_since: '1997'
        notes: The Center for Applied Internet Data Analysis (CAIDA) is a research
          unit at the San Diego Supercomputer Center, University of California San
          Diego. CAIDA acquires, analyzes, and distributes internet measurement data
          for the scientific research community, and generates the prefix-to-AS mappings
          from RouteViews BGP data. Funding is provided by the National Science Foundation
          and industry sponsors.
      - role: source_contributor
        name: Network Startup Resource Center (NSRC)
        organization_type: research_institution
        official_url: https://www.nsrc.org/
        contact_email:
        based_in: United States
        active_since: '1995'
        notes: NSRC at the University of Oregon operates the RouteViews project, which
          provides the underlying BGP routing data (RIB snapshots and update streams)
          from over 900 active peering sessions with more than 260 organizations globally.
          RouteViews is the oldest and most comprehensive public BGP data archive,
          collecting routing data since 1997 for IPv4 and 2003 for IPv6.
      derivation:
        type: original
        description: "The dataset is generated by CAIDA from RouteViews BGP routing
          data using the straightenRV tool. Each day, the median-sized BGP Routing
          Information Base (RIB) snapshot from the RouteViews collector network is
          selected to avoid truncated or problematic snapshots, then processed into
          tab-separated prefix-to-AS records. Two collectors are used for IPv4: 'oix'
          (route-views.routeviews.org, active until late March 2008) and 'rv2' (route-views2.routeviews.org,
          from late March 2008 onward). IPv6 uses the 'rv6' (route-views6) collector.
          The resulting files are gzip-compressed and made available for download."
        source_feeds: []
      listing_policy:
        summary: Not applicable. This is a passive observational dataset recording
          BGP routing announcements as observed by the RouteViews collector network,
          not a list of malicious or unwanted activity. There is no submission mechanism,
          no review process, and no criteria for adding entries — the data reflects
          what participating networks chose to announce in the global BGP routing
          system.
        criteria: []
      unlisting_policy:
        summary: Not applicable. Entries in this dataset are historical records of
          BGP routing announcements observed by the RouteViews collector network.
          They are not submitted for review and cannot be removed through any process
          — they represent what participating networks announced at a given point
          in time.
        criteria: []
      unlist_request:
      update_frequency:
        frequency: 1d
        human_readable: One new file per day, generated from the median-sized BGP
          RIB snapshot available from RouteViews on that day, per the maintainer's
          README.
      detection_classification:
        primary_method: network_telescope
        secondary_methods: []
        description: Passive BGP observation through the RouteViews collector network.
          RouteViews collects BGP routing data by maintaining direct peering sessions
          with network operators at Internet Exchange Points and through multi-hop
          peering arrangements. Over 900 active peering sessions with more than 260
          organizations (ISPs, IXPs, academic networks, and hyperscalers) contribute
          routing information globally. CAIDA processes the resulting BGP RIB snapshots
          daily to produce prefix-to-AS mappings.
      scope_and_intent:
        description: The dataset provides IPv4 and IPv6 prefix-to-autonomous-system
          number mappings for internet measurement, research, and analysis. It is
          designed for use with CAIDA's ASFinder and CoralReef tools.
        intended_for:
        - Internet measurement and research
        - BGP routing analysis
        - Network topology and AS-relationship studies
        - Prefix-to-ASN lookup for research and analytics
        not_intended_for:
        - Real-time security decisions
        - Inline blocking or firewall enforcement
        - As a sole source for determining current AS membership
      license: CAIDA Acceptable Use Agreement (Public-AUA)
      redistribution:
        allowed: false
        commercial_use_allowed:
        attribution_required: "Cite: 'The CAIDA UCSD [Dataset Name] - [dates used],
          https://catalog.caida.org/dataset/[dataset-URL]' and report the publication
          to CAIDA."
        terms: Under the CAIDA Public Acceptable Use Agreement, the data may be used
          for non-profit research, non-profit education, commercial internal testing
          and evaluation, or U.S. Government purposes. Redistribution to any person
          outside one's institute is prohibited — collaborators must request access
          separately and directly from CAIDA. All conditions and obligations attach
          to any subsequent uses; the recipient bears responsibility for enforcing
          compliance. Commercial purposes beyond internal testing require a separate
          commercial license from the UC San Diego Office of Innovation and Commercialization.
      current_status:
        state: active
        description: Actively maintained. New daily files are generated from RouteViews
          BGP snapshots, confirmed through the pfx2as-creation.log with the most recent
          entry for 2026-05-16 (seqnum 6619, generated 2026-05-17). The dataset has
          been produced continuously since 2005-05-09 for IPv4 and 2007-01-01 for
          IPv6.
        successor:
        announcement_date:
      community:
        awards: "The RouteViews data archive — of which this prefix-to-AS mapping
          is a primary derived product — has accumulated over 1,000 peer-reviewed
          academic citations as of 2022, with a formal DOI (10.7264/1y7v-2d90) enabling
          proper academic attribution. The dataset is routinely cited in leading networking
          and security venues including ACM IMC, SIGCOMM, PAM, USENIX Security, and
          IEEE/ACM Transactions on Networking. Recent publications include 'Prefix2Org:
          Mapping BGP Prefixes to Organizations' (ACM IMC 2025) and 'Live Long and
          Prosper: Analyzing Long-Lived MOAS Prefixes in BGP' (arXiv 2023)."
        criticism: "Practitioners in network operations forums have noted that BGP
          routing data — including derived products like this dataset — represents
          a single collector's perspective and cannot capture all AS links globally.
          Researchers have warned that AS path information in BGP data can be manipulated
          by any router along the path, limiting trustworthiness for mapping directly
          connected AS relationships. The maintainer acknowledges these inherent limitations
          explicitly: the first-listed AS in a MOAS entry is a convenience choice,
          not a definitive determination."
        engagement: Academic engagement is extensive, with over 1,000 peer-reviewed
          citations and active use in major networking research venues. Broader public
          practitioner discussion of this specific dataset is sparse — most discourse
          occurs in academic settings rather than public forums. Community discussion
          of related BGP datasets (RouteViews generally, RIPE RIS) tends to focus
          on coverage completeness and AS-path reliability rather than this specific
          derived product.
