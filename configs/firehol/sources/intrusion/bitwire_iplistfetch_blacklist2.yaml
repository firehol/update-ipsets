sources:
  bitwire_iplistfetch_blacklist2:
    license: public feed
    redistributable: true
    url: https://raw.githubusercontent.com/bitwire-it/ip_list_fetch/main/blacklist2.txt
    frequency: 180
    ipv: ipv4
    output: ipset
    processor:
    - remove_comments
    processor_raw: remove_comments
    category: intrusion
    provenance: secondary_upstream
    info: '[bitwire-it/ip_list_fetch](https://github.com/bitwire-it/ip_list_fetch)
      second generated blacklist feed. Entries are published as `/32` IPv4 CIDRs and
      refreshed automatically.'
    maintainer: bitwire-it
    maintainer_url: https://github.com/bitwire-it/ip_list_fetch
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-17T17:11:45Z'
      official_name: blacklist2
      official_url: https://github.com/bitwire-it/ip_list_fetch
      short_description: Second automated IP blocklist from Bitwire IT, delivering
        sorted individual IPv4 and IPv6 addresses refreshed on a scheduled GitHub
        Actions workflow.
      long_description: The blacklist2.txt file is a plain-text IP blocklist maintained
        by Bitwire IT as part of their automated threat-intelligence pipeline. Entries
        are individual IPv4 and IPv6 addresses written one per line with no prefix
        notation, sorted in ascending numeric order. The file is regenerated on a
        fixed GitHub Actions schedule; each regeneration replaces the full file rather
        than appending incremental additions. The repository contains no README, no
        LICENSE, and no published methodology describing how IPs enter or exit the
        list. A companion file dns.txt holds a whitelist entry for at least one public
        DNS resolver to prevent accidental collateral blocking. The sibling repository
        ipblocklist (also maintained by Bitwire IT) documents a broader aggregation
        methodology with explicit licensing, but that documentation does not cover
        blacklist2.txt specifically.
      roles:
      - role: maintainer
        name: Bitwire IT
        organization_type: commercial
        official_url: https://bitwire.it
        contact_email:
        based_in:
        active_since: '2025-06-30'
        notes: Cybersecurity consulting firm (Bitwire SRL, VAT IT05594960261) operating
          multiple IP blocklist repositories on GitHub. Commits to ip_list_fetch are
          attributed to the account Rush-er, which appears to be an individual developer
          working within the Bitwire IT organization.
      derivation:
        type: original
        description: The feed is generated by a proprietary automated pipeline owned
          and operated by Bitwire IT. No upstream source feeds are named in the repository's
          documentation, and no urltable or processing script is published within
          the ip_list_fetch repository itself. The sibling project ipblocklist aggregates
          from over 16 named upstream sources, but that methodology does not extend
          to blacklist2.txt specifically. The pipeline produces sorted, deduplicated
          individual IPs; no scoring, categorization, or confidence weighting is applied
          to entries in this file.
        source_feeds: []
      listing_policy:
        summary: No listing policy is published. The file contains sorted, deduplicated
          IPv4 and IPv6 addresses with no associated metadata, scoring, or category
          tag per entry. The criteria for adding an IP are not stated.
        criteria: []
      unlisting_policy:
        summary: No unlisting policy is published. The file is regenerated in full
          on each automated cycle; IPs that no longer meet whatever trigger condition
          presumably drop off when the underlying detection no longer fires. No manual
          delisting channel is documented.
        criteria: []
      unlist_request:
      update_frequency:
        frequency: 4h
        human_readable: Regenerated approximately every 4 hours on a fixed GitHub
          Actions schedule (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
      detection_classification:
        primary_method: unknown
        secondary_methods: []
        description: No detection methodology is published for this specific feed.
          The sibling project ipblocklist uses a multi-source aggregation approach
          combining honeypot data, community reports, and commercial threat-intel
          feeds, but that pipeline is not documented as applying to blacklist2.txt.
          The file contains bare IPs with no scoring or category metadata.
      scope_and_intent:
        description: The feed targets IP-based threats suitable for inline firewall
          blocking. Intended use cases are not explicitly documented by the maintainer.
        intended_for:
        - inline firewall blocking
        - network perimeter enforcement
        not_intended_for: []
      license: Public, no stated license
      redistribution:
        allowed: true
        commercial_use_allowed:
        attribution_required:
        terms: The direct upstream is publicly available (unauthenticated HTTP GET
          works) and states no redistribution restriction. No license file, no README
          terms, and no package metadata impose conditions on reuse.
      current_status:
        state: active
        description: Actively maintained as of May 17 2026. The repository receives
          automated commits on a fixed schedule (every 4 hours); the last push to
          the main branch was May 17 2026 at 12:00 PM UTC.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public community discussion is sparse. The repository has zero
          open and zero closed GitHub Issues, no pull requests, and no visible community
          contribution. The sibling project ipblocklist has accumulated over 327 stars
          on GitHub (as of May 2026), providing a proxy signal of organizational traction
          in the blocklist space, but this does not reflect discussion of blacklist2.txt
          specifically.
      sources_consulted:
      - url: https://github.com/bitwire-it/ip_list_fetch
        document_date: '2026-05-17'
        validation_date: '2026-05-17T17:05:00Z'
