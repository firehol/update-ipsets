sources:
  hagezi_tif:
    license: GPL-3.0
    redistributable: true
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/ips/tif.txt
    frequency: 240
    ipv: ipv4
    output: ipset
    processor:
    - remove_comments
    processor_raw: remove_comments
    category: intrusion
    info: '[hagezi/dns-blocklists](https://github.com/hagezi/dns-blocklists) Threat
      Intelligence Feed (TIF) — IP component of the Hagezi blocklist ecosystem. ~44K
      entries, refreshed twice daily.'
    maintainer: hagezi
    maintainer_url: https://github.com/hagezi/dns-blocklists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-17T22:13:31Z'
      official_name: Threat Intelligence Feeds (TIF)
      official_url: https://github.com/hagezi/dns-blocklists
      short_description: A DNS and IP blocklist targeting malware, cryptojacking,
        scam, and phishing, compiled from dozens of threat-intelligence sources with
        an IP-address variant for use in firewalls and DNS-based blockers.
      long_description: "The Threat Intelligence Feeds (TIF) are a specialized blocklist
        within the broader hagezi/dns-blocklists ecosystem, designed to block malware,
        cryptojacking, scam, spam, and phishing. Per the maintainer's documentation,
        the blocklists are compiled from dozens of upstream threat-intelligence sources
        — including feeds focused on IOCs, malware hostnames, phishing domains, and
        government/regulatory blocklists — combined with the maintainer's own denylists
        and extensions. The maintainer states that entries are not transferred one-to-one
        from any single source; instead, each source forms a basis that is processed,
        deduplicated, and optimized. Dead hosts are regularly pruned to keep lists
        lean, and the maintainer actively removes false positives and incorporates
        community-reported corrections. The TIF feed ships in multiple formats: Full
        (over 1.4 million entries), Medium (around 330,000), Mini (around 170,000),
        and an IP-address variant for firewalls and DNS-based blockers such as AdGuard
        Home. The IP variant consists of individual IPv4 addresses, one per line,
        with no header comments or versioning metadata embedded in the file. The project
        was founded in April 2022 and is maintained by a single individual operating
        under the GitHub handle hagezi."
      roles:
      - role: maintainer
        name: hagezi
        organization_type: individual
        official_url: https://github.com/hagezi
        contact_email: hagezi@protonmail.com
        based_in:
        active_since: 2022-04
        notes: Single-maintainer project. Operates public DNS resolvers in Germany
          (Falkenstein, Nuremberg) and Finland (Helsinki) as part of the HaGeZi DNS
          online service. Accepts community reports via GitHub Issues and distributes
          an allowlist for whitelisting false positives.
      derivation:
        type: aggregate_merge
        description: The TIF feed is compiled by aggregating and processing dozens
          of upstream threat-intelligence sources. Per the maintainer's sources.md,
          the explicitly TIF-labeled upstream is xRuffKez/tif on Codeberg. Additionally,
          the maintainer draws from a broad category of threat-intelligence, IOC,
          malware, and phishing feeds — including botvrij.eu, Cisco-Talos IOCs, CERT.pl
          (Poland), TweetFeed, Amnesty Tech investigations, Phishing Database, URLhaus,
          ThreatFox, StopForumSpam, and government sources such as USOM (Turkey) —
          plus the maintainer's own denylists and extensions. Entries are not copied
          one-to-one; they undergo processing, deduplication, false-positive removal,
          and dead-host pruning. The IP-address variant is generated by extracting
          IPv4 addresses from the domain-based TIF feeds.
        source_feeds:
        - identifier: xRuffKez/tif (Codeberg)
          relationship: aggregate_component
          notes: Explicitly labeled as the TIF source in sources.md. Also maintains
            DNSBunker DNSBL.
        - identifier: botvrij.eu (ioclist.hostname)
          relationship: aggregate_component
          notes: Threat-intelligence IOC hostname feed.
        - identifier: Cisco-Talos/IOCs
          relationship: aggregate_component
          notes: Threat intelligence IOCs from Cisco Talos.
        - identifier: CERT.pl (domains)
          relationship: aggregate_component
          notes: Polish CERT malware and phishing domain feeds.
        - identifier: TweetFeed (0xDanielLopez)
          relationship: aggregate_component
          notes: Weekly and monthly Twitter-sourced phishing IOC feeds.
        - identifier: Amnesty Tech investigations
          relationship: aggregate_component
          notes: Documented spyware and surveillance campaign IOCs.
        - identifier: Phishing Database (phishing.army, sinking.yachts)
          relationship: aggregate_component
          notes: Phishing domain blocklists.
        - identifier: URLhaus / ThreatFox (abuse.ch)
          relationship: aggregate_component
          notes: Malware host and IOC feeds from Swiss nonprofit abuse.ch.
        - identifier: StopForumSpam (toxic domains)
          relationship: aggregate_component
          notes: Forum spam and abusive domain feed.
        - identifier: USOM (Turkey)
          relationship: aggregate_component
          notes: Turkish government cyber-emergency center blocklist.
      listing_policy:
        summary: Entries enter the TIF feed through upstream threat-intelligence sources
          (malware, phishing, scam, spam, C2 IOCs) and the maintainer's own analysis.
          The maintainer processes and deduplicates incoming feeds rather than copying
          them verbatim. Dead hosts are regularly pruned, and false positives identified
          by the community are removed via an allowlist.
        criteria:
        - Presence in upstream threat-intelligence feeds (malware hostnames, phishing
          domains, scam IOCs, C2 indicators, spam senders)
        - Detection by the maintainer's own network log analysis
        - Community-reported blockable domains incorporated after review
        - Removal of entries flagged as false positives via community reports
      unlisting_policy:
        summary: False positives are handled through an allowlist maintained by the
          maintainer. Community members report incorrectly blocked domains via GitHub
          Issues; the maintainer reviews and adds legitimate domains to the allowlist,
          which prevents them from appearing in future builds. Entries that are dead
          hosts are automatically pruned during regular maintenance.
        criteria:
        - Domain submitted via GitHub Issues with evidence of legitimacy (VirusTotal
          scan, WHOIS, SSL certificate, organizational purpose)
        - Allowlist maintained and published in multiple formats at the project repository
        - Dead hosts automatically removed during regular pruning cycles
      unlist_request:
        url: https://github.com/hagezi/dns-blocklists/issues/new
        email:
        instructions: Open a new GitHub Issue at the project repository. Title the
          issue with the affected domain name. Specify which blocklist variant is
          affected (e.g., TIF, Multi Pro++). Provide evidence of the domain's legitimacy
          — VirusTotal scan results, WHOIS registration, SSL certificate details,
          or proof of organizational purpose. The maintainer reviews submissions and
          adds correctly blocked domains to the published allowlist.
      update_frequency:
        frequency: 240m
        human_readable: Refreshed twice daily, per the catalog configuration.
      detection_classification:
        primary_method: reputation_aggregation
        secondary_methods:
        - honeypot
        - user_submission
        - malware_analysis
        description: 'The TIF feed is built by aggregating and processing outputs
          from dozens of upstream threat-intelligence sources. These upstream sources
          vary in their own detection methods: some draw from honeypot networks, others
          from sandbox analysis or malware reversing (producing malware-analysis IOCs),
          and many from community-submitted reports or fraud-tracker correlation.
          The maintainer additionally contributes their own network log analysis and
          denylist extensions. The resulting composite is scrubbed for duplicates,
          dead hosts, and false positives before publication.'
      scope_and_intent:
        description: 'The TIF feed targets infrastructure used in or supporting malicious
          activity: malware delivery and command-and-control servers, cryptojacking
          scripts, phishing sites, scam operations, spam senders, and fraudulent online
          stores. It is not designed as a general ad-blocking or tracking-blocking
          list — that role is filled by other hagezi variants (Multi Pro, Pro++, Ultimate).
          The IP-address variant is intended for deployment in firewalls, router blocklists,
          and DNS-based blockers that consume IP-format feeds.'
        intended_for:
        - Blocking malware delivery and C2 server communications
        - Blocking cryptojacking script loads
        - Blocking phishing, scam, and fraudulent domain resolves
        - Firewall and router IP-based blocking
        - DNS-based blockers supporting IP-format feeds (AdGuard Home, pfBlockerNG)
        not_intended_for:
        - General advertising blocking
        - Generic tracker blocking
        - Privacy enhancement (handled by other hagezi Multi variants)
      license: GPL-3.0
      redistribution:
        allowed: true
        commercial_use_allowed:
        attribution_required: Credit required under GPL-3.0 Section 1 — appropriate
          copyright notice must be retained on redistributed copies
        terms: Redistribution and use in source and binary forms are permitted under
          GPL-3.0 terms. Modified versions must be marked as changed, carry prominent
          modification notices, and be distributed under the same license. Commercial
          use is governed by GPL-3.0 provisions — distributing modified works commercially
          may require supplying corresponding source code. The data is provided free
          of charge and without warranty; users bear all risk.
      current_status:
        state: active
        description: Actively maintained as of May 2026. Regular updates are published
          to the GitHub repository; the latest release tag (37522026.137.67601) was
          published on 2026-05-17. The maintainer operates public DNS resolvers in
          Germany and Finland. No discontinuation or migration notice has been issued.
        successor:
        announcement_date:
      community:
        awards:
        criticism: Community-reported false positive incidents have been documented
          on the GitHub issue tracker and in public forums. Documented cases include
          a personal homelab blocked due to a .wtf TLD, a soccer statistics site blocked
          under the gambling category, a German civic organization blocked by TIF,
          and a French social security portal blocked by TIF. Root causes identified
          in issue discussions include keyword/heuristic filter collisions (triggering
          on terms like 'rechnung' for invoice), TLD-based overblocking (.wtf, .xyz,
          .ai), and newly registered domains awaiting reputation buildup. The maintainer
          has resolved the majority of filed reports by adding affected domains to
          the published allowlist; at least two cases were declined as wontfix. The
          TIF feed's size constraint has been acknowledged as an ongoing challenge
          by the upstream xRuffKez author, who noted difficulty balancing coverage
          against the list's footprint.
        engagement: Strong community engagement across multiple platforms. Approximately
          30 closed GitHub issues (March–May 2026), all resolved, demonstrating an
          active resolution workflow. On Reddit, posts discussing hagezi blocklists
          have attracted hundreds of upvotes, with multiple calls for platform integration
          (particularly NextDNS). Community consensus identifies the Pro++ variant
          combined with TIF as a recommended minimal stack for advanced users. The
          maintainer is personally active across Signal, Telegram, Discord, Mastodon,
          Bluesky, and Reddit, and responds to issue reports on GitHub. The project
          is integrated into multiple public DNS resolver services (HaGeZi DNS EU,
          ControlD, DNSBunker, RethinkDNS, DNSwarden, OpenBLD.net).
