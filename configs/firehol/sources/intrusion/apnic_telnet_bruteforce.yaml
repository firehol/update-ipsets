sources:
  apnic_telnet_bruteforce:
    license: public feed
    redistributable: true
    url: https://feeds.honeynet.asia/bruteforce/latest-telnetbruteforce-unique.csv
    frequency: 1440
    ipv: ipv4
    output: ipset
    processor:
    - csv_column:
        index: "1"
    - filter_ip4
    processor_raw: csv_comma_first_column
    category: intrusion
    info: '[APNIC Community Honeynet Project](https://feeds.honeynet.asia/) Telnet
      brute-force source IPs from the MISP default feed catalog. CSV feed with the
      observed IP in the first column.'
    maintainer: APNIC Community Honeynet Project
    maintainer_url: https://feeds.honeynet.asia/
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-16T14:01:18Z'
      official_name: APNIC Community Honeynet Project Telnet Bruteforce Feed
      official_url: https://feeds.honeynet.asia/bruteforce/
      short_description: Daily snapshot of unique source IP addresses observed conducting
        brute-force login attempts against Telnet honeypot sensors deployed across
        the Asia-Pacific region.
      long_description: "The APNIC Community Honeynet Project operates a distributed
        network of honeypot sensors across the Asia-Pacific region and beyond. These
        sensors emulate Telnet services and log authentication attempts made by remote
        attackers. The resulting feed captures the source IP addresses observed attempting
        brute-force logins against these honeypots.\n\nThe project uses Cowrie, a
        medium-to-high interaction SSH and Telnet honeypot, deployed via the CommunityHoneyNetwork
        orchestration platform. Sensors are hosted by volunteer participants ranging
        from universities to network operators across the region. The feed is generated
        daily and distributed in CSV format.\n\nTwo variants are available: a full
        log containing all observed attempts, and a unique variant containing only
        distinct source IP addresses. The unique variant is suitable for firewall
        blocklisting where deduplication is preferred. Data is also shared with the
        ShadowServer Foundation and fed into MISP threat-sharing communities."
      roles:
      - role: maintainer
        name: APNIC Community Honeynet Project
        organization_type: research_institution
        official_url: https://feeds.honeynet.asia/
        contact_email: project@honeynet.asia
        based_in: Singapore / Asia-Pacific
        active_since: '2019'
        notes: Operates distributed honeypot sensors across the Asia-Pacific region
          to collect threat intelligence on malicious network activity. Participants
          can join by deploying honeypot sensors registered to the project's CHN Server.
      derivation:
        type: original
        description: First-party detection feed generated by the APNIC Community Honeynet
          sensor network. Cowrie honeypot instances deployed across participant-run
          nodes passively observe and log incoming Telnet connection attempts. Source
          IP addresses are extracted daily and published as a CSV snapshot. The unique
          variant removes duplicates observed across the sensor network within the
          reporting period.
        source_feeds: []
      listing_policy:
        summary: Any remote IP address that connects to a project honeypot sensor
          and attempts a Telnet login is captured in the feed. No human review or
          whitelist is applied - the feed reflects raw sensor observations.
        criteria:
        - Connects to a project-deployed Cowrie Telnet honeypot sensor
        - Initiates a Telnet login sequence (authentication attempt)
      unlisting_policy:
        summary: No manual unlisting mechanism is offered. IPs naturally expire as
          the daily feed is replaced with a new snapshot containing only IPs observed
          in the preceding 24-hour period.
        criteria:
        - Automatic daily refresh overwrites previous snapshot
        - No persistent listing - IPs only present if actively observed on the day
      unlist_request:
      update_frequency:
        frequency: 1d
        human_readable: Updated daily, typically late evening (UTC)
      detection_classification:
        primary_method: honeypot
        secondary_methods: []
        description: Passive network observation via Cowrie honeypot sensors emulating
          Telnet services. The honeypots accept connections and log authentication
          attempts without initiating outbound communication with targets. Attackers
          connecting to these fake Telnet services have their source IP recorded regardless
          of whether the login succeeds or fails.
      scope_and_intent:
        description: The feed is intended for network operators and security teams
          seeking to block brute-force login attempts originating from the Asia-Pacific
          region sensor footprint.
        intended_for:
        - Firewall blocklisting at network perimeter
        - Enriching SIEM or threat-intel pipelines with honeypot-derived indicators
        - Research into Telnet-based brute-force attack patterns
        not_intended_for:
        - Legal or law enforcement action (observational data only)
        - Attributing attacks to specific threat actors (IPs may be compromised infrastructure)
      license: Public, no stated license
      redistribution:
        allowed: true
        commercial_use_allowed:
        attribution_required:
        terms:
      current_status:
        state: active
        description: Maintained as of May 15, 2026. Daily feeds confirmed present
          on the maintainer server.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Sparse independent public discussion found. The feed is primarily
          referenced in MISP feed catalogs and security tooling integrations rather
          than debated in public forums. No notable complaints or endorsements were
          identified in community discussions.
