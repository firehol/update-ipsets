        document_date: '2026-02-03'
        validation_date: '2026-05-16T16:22:00Z'
      - url: https://www.vanimpe.eu/about/curriculum-vitae-in-english
        document_date:
        validation_date: '2026-05-16T16:23:00Z'
      - url: https://github.com/fortinet-fortisoar/connector-botvrij-misp-osint-feed
        document_date: '2022-01-04'
        validation_date: '2026-05-16T16:21:00Z'
