      short_description: A generated IP blocklist maintained by BitWire IT, delivering
        individual IPv4 and IPv6 addresses as /32 or /128 CIDRs, refreshed on an automated
        schedule.
      long_description: "The feed is produced by the bitwire-it organization and hosted
        as a plain-text file on GitHub. Entries are published as individual host addresses
        — IPv4 as /32 and IPv6 as /128 — with no headers, comments, or metadata embedded
        in the file. Updates are driven by an automated pipeline that commits revised
        listings every 4 hours on a UTC-aligned schedule.\n\nThe repository has no
        README, no description field, no topics, and no LICENSE file. The maintainer
        publishes no methodology document for this feed — sourcing criteria, detection
        method, listing thresholds, and unlisting process are not documented at the
        direct upstream."
