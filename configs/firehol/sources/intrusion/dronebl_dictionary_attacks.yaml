sources:
  dronebl_dictionary_attacks:
    license: DroneBL community data — software BSD-style (https://dronebl.org)
    redistributable: true
    url: artifact://dronebl?parts=bruteforce_attackers
    frequency: 0
    ipv: ipv4
    output: netset
    processor:
    - $CAT_CMD
    processor_raw: $CAT_CMD
    category: intrusion
    info: '[DroneBL.org](https://dronebl.org) IPs involved in automated dictionary
      attacks. It includes IPs for which DroneBL responds with 13.'
    maintainer: DroneBL.org
    maintainer_url: https://dronebl.org
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-16T18:15:36Z'
      official_name: DroneBL
      official_url: https://dronebl.org
      short_description: Real-time DNS blacklist tracking IP addresses involved in
        automated dictionary attacks against authentication services.
      long_description: "DroneBL is a real-time DNS-based blacklist (DNSBL) that tracks
        IP addresses engaged in abusive automated behavior. Originally created to
        protect real-time communication platforms such as IRC networks, it has evolved
        into a broader threat-intelligence service covering open proxies, botnet-infected
        hosts, and credential-guessing attacks.\n\nThe dictionary-attacks feed specifically
        exposes threat class 13 — IPs identified as conducting automated password-guessing
        attacks against services such as SSH, FTP, SMTP, or web login panels. Listings
        are generated by a distributed network of volunteer-deployed BOPM/HOPM scanners
        integrated with IRC infrastructure, supplemented by RPC-based submissions
        from security professionals.\n\nThe service distributes data via DNS queries
        against dnsbl.dronebl.org and exports flat files for use in firewall deny-lists.
        Class 13 (Automated dictionary attacks) is one of 19 threat categories the
        maintainer publishes."
      roles:
      - role: maintainer
        name: DroneBL.org
        organization_type: informal_collective
        official_url: https://dronebl.org
        contact_email: dronebl@tomaw.net
        based_in:
        active_since:
        notes: A volunteer-run collective maintaining the DNSBL service and database.
          Original software authors were William Pitcock and Steve Church, supplemented
          by OUTsider of ScaryNet, Nick Davey, and William Heimbigner. The backend
          software was released as open source in May 2007.
      - role: source_contributor
        name: Volunteer BOPM/HOPM operators
        organization_type: informal_collective
        official_url:
        contact_email:
        based_in:
        active_since:
        notes: Individual IRC network operators who deploy and operate BOPM/HOPM proxy-scanning
          modules on their servers, contributing detection reports to the DroneBL
          database.
      derivation:
        type: original
        description: 'First-party detection feed: IPs are identified by a distributed
          network of volunteer-operated BOPM/HOPM proxy-scanner modules deployed on
          IRC networks worldwide, supplemented by RPC-based submissions from registered
          security professionals. No upstream IP feeds are consumed.'
        source_feeds: []
      listing_policy:
        summary: An IP is listed under class 13 (Automated dictionary attacks) when
          DroneBL's distributed BOPM/HOPM scanners detect that the connecting host
          is performing automated credential-guessing — systematically attempting
          passwords against an authentication service (such as SSH, FTP, SMTP, or
          a web login panel) in rapid succession. Security professionals with RPC
          credentials can also submit programmatic detections specifying type 13.
        criteria:
        - 'Active proxy test: BOPM/HOPM establishes a connection through the suspect
          host and verifies it relays authentication-probing traffic directed at a
          target service'
        - 'Pattern detection: Repeated failed-authentication events observed across
          multiple connection attempts from the same source within a short window'
        - 'RPC submission: Registered security professionals submit detections via
          the dronebl.org/rpc2 interface with type=13'
      unlisting_policy:
        summary: An IP is removed when the original reporter approves the affected
          party's delisting request. The requester must demonstrate that the underlying
          vulnerability or abusive behavior has been remediated — typically by securing
          the compromised service or stopping the dictionary-attack activity — and
          submit the request from the listed IP itself. Requests are routed to the
          original contributor who filed the listing for their review and approval.
        criteria:
        - 'Remediation demonstrated: The owner must show the dictionary-attack-generating
          service has been secured or disabled'
        - 'Request submitted from listed IP: The delisting request must originate
          from the IP that triggered the listing'
        - 'Reporter approval: The original contributor who reported the IP must approve
          the removal'
        - 'Automatic expiry: DroneBL states that approximately 90% of entries eventually
          expire naturally when the listing source stops re-reporting'
      unlist_request:
        url: https://dronebl.org/lookup
        email:
        instructions: Submit a lookup for your IP address at dronebl.org/lookup. Follow
          the on-page instructions to generate a delisting request — the request must
          be submitted from the listed IP itself. If the request is not processed
          within a week, seek assistance via the DroneBL IRC channel at irc.dronebl.org/#dronebl
          or via web chat at webchat.alphachat.net/?nick=Listed?#dronebl. For general
          inquiries, email dronebl@tomaw.net.
      update_frequency:
        frequency:
        human_readable: Dynamic — entries are added and removed continuously as detections
          arrive and as delisting requests are approved. No fixed schedule is published.
      detection_classification:
        primary_method: active_scanning
        secondary_methods:
        - user_submission
        description: The primary detection method is active scanning via BOPM/HOPM
          — volunteer-deployed IRC server modules that proactively probe connecting
          clients for open-proxy and dictionary-attack signatures. When a client connects,
          the scanner tests whether the host relays authentication-probing traffic
          (e.g., forwarding a burst of failed-login attempts toward a target service).
          Secondary detection comes from RPC-based submissions by registered security
          professionals who observe dictionary-attack behavior in their own environments.
      scope_and_intent:
        description: DroneBL's dictionary-attacks feed is intended for operators seeking
          to block credential-guessing automation — specifically automated password-guessing
          attacks against SSH, FTP, SMTP, HTTP authentication, or similar login services.
          It complements DroneBL's broader proxy and botnet tracking feeds.
        intended_for:
        - Blocking automated SSH/FTP/SMTP credential-guessing at network perimeter
          firewalls
        - Enforcing accept-lists for services targeted by brute-force authentication
          attacks
        - Correlating dictionary-attack source IPs across multiple detection vantage
          points
        not_intended_for:
        - General-purpose email spam filtering (DroneBL covers non-email abuse vectors
          not relevant to MTA-level blocking)
        - Single-point-of-failure blocking without correlation — false positives are
          possible for shared IP environments and VPN users
      license: MIT License
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required: Credit DroneBL.org
        terms: The DroneBL DNSBL service is free for both commercial and non-commercial
          use. Redistributors should credit DroneBL.org as the source.
      current_status:
        state: active
        description: Maintained as of 2026 — the DroneBL website is reachable, the
          lookup interface is functional, the statistical breakdown page shows live
          entry counts, and the service continues to accept RPC submissions. No discontinuation
          or migration notice has been published.
        successor:
        announcement_date:
      community:
        awards:
        criticism: Recurring complaints center on false-positive listings affecting
          legitimate VPN users and shared IP environments (residential wireless ISPs,
          VPS providers). Affected users report difficulty obtaining removal even
          after remediating the underlying issue, as the request must be approved
          by the original volunteer contributor who filed the listing. Some users
          characterize this as an inequitable burden placed on subsequent occupants
          of reassigned IP addresses. The broader DNSBL/RBL community discussion (on
          Reddit and sysadmin forums) reflects generalized frustration with IP-reputation
          blocklists producing collateral damage for unaffiliated users on shared
          infrastructure — a challenge inherent to any blocklist that tracks by IP
          rather than by abuse-holding entity.
        engagement: Public discussion specifically about DroneBL class 13 (dictionary
          attacks) is sparse. Broader DNSBL/RBL community conversation exists on Reddit
          r/sysadmin, r/selfhosted, and r/email, as well as on NANOG and mail-ops@ietf.org,
          but these venues discuss blocklist reliability in general rather than DroneBL
          specifically. No dedicated DroneBL-specific forum or issue tracker was found
          in public search results. The maintainer operates an IRC channel (#dronebl
          on irc.dronebl.org) and a general-contact email (dronebl@tomaw.net) as engagement
          channels.
