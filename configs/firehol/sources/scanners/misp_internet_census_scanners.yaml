sources:
  misp_internet_census_scanners:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/internet-census-nt-scanning/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: scanners
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Internet
      Census research scanner IPs. Informational — not for blocking.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T21:13:07+00:00'
      official_name: Internet census IP Ranges Used for Scanning
      official_url: https://github.com/MISP/misp-warninglists
      short_description: A MISP warninglist of CIDR ranges associated with internet-wide
        scanning infrastructure, sourced from CIRCL Network Telescope analysis, for
        flagging potential false positives in threat intelligence.
      long_description: "This warninglist records IP address ranges that CIRCL's network
        telescope analysis attributes to generic \"internet census\" scanning activity
        — that is, internet-wide measurement and enumeration that the CIRCL analysts
        could not, or chose not to, pin to a single named vendor. What distinguishes
        this list from the sibling -nt-scanning lists is its catch-all framing: where
        lists like censys-scanning, shodan-scanning, or onyphe-scanning each track
        one identifiable operator, this one collects observed scanning sources whose
        attribution is the broader category of internet-census activity itself.\n\n\
        Operators reading the file should keep that scope in mind: an entry here means
        CIRCL's telescope saw scanning behaviour consistent with census-style enumeration,
        not that the IP has been identified as belonging to a specific commercial
        scanner. The list is not designed for inline blocking or automated denial."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: research_institution
        official_url: https://github.com/MISP
        contact_email:
        based_in: Luxembourg
        active_since: '2016'
        notes: The MISP Project develops and distributes the MISP threat intelligence
          platform and its associated warninglists, feeds, and galaxy taxonomies.
          CIRCL (Computer Incident Response Center Luxembourg) is the organisational
          home of the MISP Project.
      - role: source_contributor
        name: Paul Jung (Thanat0s)
        organization_type:
        official_url:
        contact_email:
        based_in:
        active_since:
        notes: Identified as the primary author of the May 2026 Network Telescope
          update commit, which included revisions to the internet-census-nt-scanning
          list. Authorship attributed from commit da68b87 on the MISP/misp-warninglists
          repository.
      - role: source_contributor
        name: CIRCL
        organization_type: research_institution
        official_url: https://www.circl.lu
        contact_email:
        based_in: Luxembourg
        active_since:
        notes: CIRCL (Computer Incident Response Center Luxembourg) operates the Network
          Telescope infrastructure that generates the scanner CIDR analysis feeding
          this warninglist. CIRCL is the institutional home of the MISP Project.
      derivation:
        type: original
        description: The CIDR ranges in this list are produced by CIRCL's Network
          Telescope analysis — a passive darknet observation system that collects
          unsolicited inbound traffic directed at unallocated address space. From
          this traffic corpus, CIRCL identifies IP ranges exhibiting characteristics
          of large-scale internet scanning infrastructure (such as systematic port
          sweeps or service fingerprinting) and extracts the corresponding CIDR allocations.
          The resulting ranges are converted into MISP warninglist JSON format with
          CIDR-type matching. No other IP feeds are consumed as inputs; the list is
          a first-party analytical product of CIRCL's sensor infrastructure.
        source_feeds: []
      listing_policy:
        summary: An IP range is listed when CIRCL's Network Telescope analysis identifies
          it as associated with internet-wide scanning infrastructure — automated
          systems that systematically probe large portions of the IPv4 address space
          to discover services, fingerprints, or vulnerabilities. The list captures
          CIDR allocations covering observed scanning endpoints, expressed as individual
          host or subnet CIDR blocks.
        criteria:
        - Observed scanning behaviour targeting darknet address space, characterised
          by CIRCL's Network Telescope as internet census scanning
        - Attribution to known large-scale scanning platforms (Shodan, Censys, or
          analogous internet census infrastructure)
        - 'CIDR-range granularity: entries represent allocated network blocks containing
          scanning endpoints'
      unlisting_policy:
        summary: No formal unlisting policy is documented. Removal or revision of
          entries occurs when CIRCL's Network Telescope analysis is updated to reflect
          changes in observed scanning infrastructure — for example, when a previously
          observed scanning range retires or reallocates. Community members can propose
          removals or corrections through the GitHub issue tracker or by submitting
          a pull request with an incremented version number.
        criteria:
        - 'Automatic expiry: not applicable — entries persist until manually revised
          in a CIRCL update'
        - 'Manual revision: CIRCL analysts update the list when Network Telescope
          characterisation of scanning infrastructure changes'
        - 'Community correction: GitHub pull request with version increment, or GitHub
          issue filed against the repository'
      unlist_request:
        url: https://github.com/MISP/misp-warninglists/issues/new
        email:
        instructions: To request a correction or removal of an entry from this warninglist,
          file a GitHub issue against the MISP/misp-warninglists repository. Describe
          the IP range in question and the reason it should be reconsidered. Alternatively,
          submit a pull request with the corrected list.json and an incremented version
          number, per the standard warninglist update workflow documented by CIRCL.
      update_frequency:
        frequency: 30d
        human_readable: Updated approximately monthly, aligned with CIRCL Network
          Telescope analysis refresh cycles, per the version-encoded date field in
          the list metadata
      detection_classification:
        primary_method: network_telescope
        secondary_methods: []
        description: "The list is built from CIRCL's Network Telescope — a passive
          darknet observation system that records unsolicited inbound traffic arriving
          at unallocated (darknet) address space. Because the address space is unused,
          any incoming packet is inherently anomalous and represents either stray
          traffic, scanning, or probing. By analysing the volume, source distribution,
          and behavioural signatures of this traffic over time, CIRCL identifies IP
          ranges exhibiting patterns consistent with large-scale internet scanning
          infrastructure. The resulting CIDR allocations are packaged into the warninglist.
          This is a passive, observational methodology: no active probes are sent
          by CIRCL; the detection relies entirely on receiving and characterising
          inbound traffic."
      scope_and_intent:
        description: The list flags IP ranges associated with legitimate, lawful internet
          scanning platforms as potential false positives in MISP threat intelligence
          workflows. Its purpose is informational warning, not threat indication.
        intended_for:
        - Flagging MISP attributes that match known scanning infrastructure to prevent
          misattribution as malicious
        - Reducing analyst noise from legitimate internet scanning traffic in threat
          intelligence operations
        - Enriching MISP events with contextual awareness that an IP belongs to a
          recognised scanning platform
        not_intended_for:
        - Inline blocking or automated denial of network traffic
        - Attributing malicious intent to matched IPs — a match indicates a known
          scanner, not a threat actor
        - Use as a standalone threat intelligence indicator without accompanying analyst
          judgement
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: Under CC0 1.0 (Public Domain Dedication), no attribution is legally
          required, though crediting CIRCL and the MISP Project is customary practice
          in the threat intelligence community.
      current_status:
        state: active
        description: Actively maintained. The list was updated in May 2026 (version
          26050407, dated 2026-05-04) as part of a coordinated Network Telescope update
          batch committed by Paul Jung (Thanat0s). Prior update was in April 2026.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public community discussion specifically about the internet-census-nt-scanning
          list is sparse. No dedicated discussion threads about this list were found
          on Reddit or general security forums — engagement appears concentrated in
          the upstream GitHub issue tracker rather than public social channels.
