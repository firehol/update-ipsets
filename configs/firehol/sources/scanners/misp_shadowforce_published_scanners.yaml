sources:
  misp_shadowforce_published_scanners:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/shadowforce-scanning/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: scanners
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Shadowforce
      scanner IP ranges. Informational - not for blocking.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T23:18:43+00:00'
      official_name: Shadowforce IP-Ranges, pot. used for Scanning
      official_url: https://github.com/MISP/misp-warninglists/tree/main/lists/shadowforce-scanning
      short_description: A MISP warninglist identifying IP ranges associated with
        shadowforce.io scanning infrastructure, to flag potential false positives
        in threat intelligence analysis.
      long_description: "This feed is a MISP warninglist that identifies IP ranges
        associated with shadowforce.io, the research division of Baffin Bay Networks
        (a Mastercard company). Shadowforce operates a Global Sensory Network (GSN)
        of data collectors deployed worldwide, performing both passive and active
        internet-wide scanning of IPv4 and IPv6 address spaces to collect threat intelligence.
        The resulting IP reputation data feeds Baffin's commercial Threat Protection
        product.\n\nA companion variant, shadowforce-nt-scanning, draws from CIRCL's
        own Network Telescope passive observation data, providing independent corroboration
        of Shadowforce scanner infrastructure.\n\nAs a warninglist rather than a blocklist,
        this feed is designed for informational alerting within MISP — it raises a
        flag when analyst-reported IPs match known scanning infrastructure, helping
        distinguish intentional reconnaissance from hostile activity. The maintainer's
        own description frames the list as informational only, not for automated blocking."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: research_institution
        official_url: https://github.com/MISP
        contact_email:
        based_in: Luxembourg
        active_since: '2016'
        notes: The MISP Project maintains the misp-warninglists repository, which
          houses this warninglist. The project is coordinated by CIRCL Luxembourg
          (Computer Incident Response Center Luxembourg).
      - role: original_author
        name: Paul Jung (Thanat0s)
        organization_type: research_institution
        official_url:
        contact_email: Paul.Jung@circl.lu
        based_in: Luxembourg
        active_since:
        notes: Contributor credited in the commit adding this warninglist, affiliated
          with CIRCL Luxembourg.
      - role: source_contributor
        name: CIRCL Luxembourg
        organization_type: research_institution
        official_url: https://www.circl.lu
        contact_email:
        based_in: Luxembourg
        active_since:
        notes: Provided the Network Telescope analysis underpinning the shadowforce-nt-scanning
          companion variant. The shadowforce-scanning list itself was committed by
          a CIRCL staff member.
      - role: source_contributor
        name: Shadowforce / Baffin Bay Networks
        organization_type: commercial
        official_url: https://shadowforce.io
        contact_email: info@shadowforce.io
        based_in: Sweden
        active_since: '2017'
        notes: The organization whose published scanning infrastructure forms the
          basis of this warninglist. Shadowforce is the research division of Baffin
          Bay Networks, acquired by Mastercard in March 2023. Operates a Global Sensory
          Network (GSN) of thousands of collectors performing passive and active internet-wide
          scanning.
      derivation:
        type: derivative
        description: This warninglist is a derivative publication of shadowforce.io's
          publicly disclosed scanning infrastructure. The list was contributed to
          the MISP warninglists repository by CIRCL Luxembourg staff. A companion
          variant (shadowforce-nt-scanning) independently corroborates these ranges
          using CIRCL's own Network Telescope passive observation data. The list does
          not consume other IP feeds; it is sourced from the target organisation's
          own published reconnaissance footprint.
        source_feeds: []
      listing_policy:
        summary: An IP is listed when it is identified as belonging to shadowforce.io's
          published scanning infrastructure. Shadowforce operates a Global Sensory
          Network (GSN) of thousands of globally distributed data collectors performing
          both passive and active internet-wide scanning of IPv4 and IPv6 address
          spaces. The maintainer contributes this list to help analysts recognize
          Shadowforce reconnaissance traffic and avoid mistaking it for hostile activity.
        criteria:
        - IP address falls within a CIDR range allocated to or used by shadowforce.io
          scanning infrastructure
        - Attribution supported by observation of Shadowforce scanner behavior such
          as specific user-agent strings, TLS fingerprints, or connection patterns
          characteristic of their GSN
      unlisting_policy:
        summary: No formal unlisting policy is documented for this warninglist. As
          an informational warninglist identifying a third party's published scanning
          infrastructure, removals would occur if the listed CIDR ranges were retired
          by Shadowforce or reassigned to unrelated parties. Requests related to Shadowforce's
          own scanning scope can be directed to Shadowforce's opt-out channel.
        criteria:
        - CIDR range is no longer associated with shadowforce.io scanning activity
        - CIDR range has been reassigned to an unrelated organization
      unlist_request:
      update_frequency:
        frequency: 1d
        human_readable: Once per day, per the maintainer's stated frequency.
      detection_classification:
        primary_method: mixed
        secondary_methods:
        - network_telescope
        - active_scanning
        description: Detection for this feed combines passive and active methods.
          Shadowforce's Global Sensory Network (GSN) deploys thousands of data collectors
          that passively observe unsolicited inbound traffic (network telescope methodology)
          and actively probe address spaces across IPv4 and IPv6. The companion variant
          (shadowforce-nt-scanning) independently validates these findings using CIRCL
          Luxembourg's own network telescope passive observation data.
      scope_and_intent:
        description: This warninglist identifies IP addresses associated with shadowforce.io
          scanning infrastructure to enable MISP analysts to recognize when observed
          reconnaissance originates from a known benign scanning organization rather
          than a threat actor.
        intended_for:
        - Flagging potential false positives in MISP event and attribute analysis
        - Filtering scanner IPs at the MISP API level to reduce noise in threat intelligence
          workflows
        - Distinguishing Shadowforce reconnaissance from hostile scanning activity
        not_intended_for:
        - Automated blocking or denial-of-service mitigation
        - Firewall rule generation
        - Enforcement actions against the listed entities
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 Universal Public Domain Dedication imposes no conditions on
          reuse. The data may be copied, modified, redistributed, and used for any
          purpose without attribution or restrictions.
      current_status:
        state: active
        description: Active. The shadowforce-scanning list is present in the MISP
          warninglists repository, with the companion shadowforce-nt-scanning variant
          receiving regular telescope refreshes.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public community discussion specific to the shadowforce-scanning
          warninglist is sparse. No notable complaints or controversy regarding this
          specific list were found in public forums. Shadowforce appears alongside
          other legitimate scanning organisations in scanner-catalog compilations,
          indicating broad ecosystem recognition as a known scanner.
