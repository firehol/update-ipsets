sources:
  misp_onyphe_published_scanners:
    license: CC0 1.0 (MISP warninglists)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/onyphe-scanner/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: scanners
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) published
      ONYPHE scanner IP address ranges. Informational - not for blocking.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T22:36:13+00:00'
      official_name: List of published IP address ranges for Onyphe Scanner
      official_url: https://github.com/MISP/misp-warninglists/tree/main/lists/onyphe-scanner
      short_description: A MISP warninglist of IP address ranges used by ONYPHE's
        internet scanning infrastructure, allowing analysts to identify ONYPHE reconnaissance
        traffic as a known-benign source rather than hostile scanning.
      long_description: "This warninglist maps the IP address ranges that ONYPHE —
        a French cyber defense platform founded in 2017 — uses to conduct internet-scale
        scanning. ONYPHE describes its methodology as net-neutral: it scans every
        exposed asset it discovers and retains historical scan data for seven months.
        The company publishes its scanner IP ranges publicly at onyphe.io/ip-ranges.txt,
        organized by region (France, United States, China) and address family (IPv4,
        IPv6).\n\nThe MISP warninglist is generated by a Python script (generate-onyphe-scanner.py)
        that downloads ONYPHE's plain-text ip-ranges.txt file, strips comment-section
        markers, and passes the resulting CIDR entries through a network-consolidation
        step to merge overlapping or adjacent ranges before writing the MISP-compatible
        JSON. The list is typed as CIDR and matches against ip-src, ip-dst, domain|ip,
        ip-src|port, and ip-dst|port MISP attribute types.\n\nThe ONYPHE scanner list
        is explicitly informational, not a blocklist — it alerts analysts when an
        indicator matches ONYPHE's authorised scanning sources so they can suppress
        false-positive triage actions."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: non_profit
        official_url: https://github.com/MISP
        contact_email:
        based_in:
        active_since:
        notes: The MISP Project maintains the misp-warninglists repository, reviews
          and merges pull requests, and publishes the warninglist JSON under CC0 1.0.
          The project is led by Renaud Feilliat (adulau) and a community of contributors.
      - role: source_contributor
        name: ONYPHE
        organization_type: commercial
        official_url: https://www.onyphe.io/
        contact_email: contact@onyphe.io
        based_in: France
        active_since: '2017'
        notes: ONYPHE publishes its scanner IP ranges at onyphe.io/ip-ranges.txt.
          The company was founded mid-2017 in France by CTO Patrice Auffret. Their
          ethical scanning practices are documented as the '10 Commandments of Ethical
          Internet Scanning.'
      derivation:
        type: derivative
        description: "The warninglist is produced by a Python generator script that
          downloads ONYPHE's plain-text ip-ranges.txt file, strips comment-header
          lines (lines beginning with #), strips trailing whitespace from each remaining
          line, and passes the resulting CIDR entries through a network-consolidation
          function that merges overlapping or adjacent ranges before writing the MISP
          warninglist JSON. The script runs as part of the misp-warninglists generate-all.sh
          workflow. The sole upstream data source is ONYPHE's self-published scanner
          IP ranges file."
        source_feeds:
        - identifier: https://www.onyphe.io/ip-ranges.txt
          relationship: mirror
          notes: ONYPHE's publicly published scanner IP ranges, segmented by region
            (France, United States, China) and address family (IPv4, IPv6). The MISP
            generator mirrors this file directly, applying CIDR consolidation but
            no additional filtering.
      listing_policy:
        summary: An IP address or CIDR range is listed when it appears in ONYPHE's
          publicly published scanner IP ranges file (onyphe.io/ip-ranges.txt). ONYPHE
          describes its own scanner infrastructure as comprising fixed, identifiable
          IP addresses used for net-neutral internet scanning. The MISP warninglist
          mirrors this published set without applying additional scoring or filtering.
        criteria:
        - The IP range must appear in ONYPHE's self-published ip-ranges.txt file
        - The range must represent ONYPHE's active scanning infrastructure as disclosed
          by ONYPHE
      unlisting_policy:
        summary: Entries are removed when ONYPHE no longer includes them in its published
          ip-ranges.txt file. Because the list is generated programmatically from
          ONYPHE's live published file, any range ONYPHE withdraws from public disclosure
          disappears from the MISP warninglist at the next regeneration cycle. There
          is no separate MISP-managed removal review process for this list.
        criteria:
        - ONYPHE removes the range from its published ip-ranges.txt
        - The next generation run excludes the withdrawn range
      unlist_request:
        url:
        email:
        instructions: Because this is an informational warninglist that mirrors ONYPHE's
          publicly disclosed scanner ranges, unlisting requests are not directed to
          the MISP project. Organizations wishing to request removal of their IP from
          ONYPHE's published scanner ranges should contact ONYPHE directly at contact@onyphe.io
          (PGP key available). Once ONYPHE removes the IP from ip-ranges.txt, it will
          exit the MISP warninglist at the next regeneration.
      update_frequency:
      detection_classification:
        primary_method: reputation_aggregation
        secondary_methods: []
        description: "The list classifies IP addresses by aggregating ONYPHE's self-published
          scanner infrastructure ranges. Rather than detecting malicious activity
          through sensors, honeypots, or user submissions, the list compiles the IP
          ranges that ONYPHE voluntarily discloses as its authorized scanning sources.
          This is a reputation-based approach: IPs are listed because ONYPHE declares
          them as its own, not because they were observed attacking or probing the
          list maintainer's infrastructure."
      scope_and_intent:
        description: "The list identifies traffic originating from ONYPHE's authorized
          scanning infrastructure. ONYPHE conducts net-neutral internet scanning at
          scale, discovering exposed assets and crawling the dark web. Their scanner
          IPs are a known-benign source: they generate reconnaissance traffic that
          may appear in firewall logs, SIEM alerts, and threat intelligence correlations,
          but do not represent hostile activity. The MISP warninglist flags these
          matches so analysts can suppress false-positive triage actions."
        intended_for:
        - Identifying ONYPHE reconnaissance traffic in security monitoring pipelines
        - Suppressing false-positive alerts in SIEM and IDS/IPS systems
        - Enriching threat intelligence with scanner-source attribution
        - Filtering MISP events for known-benign scanning activity
        not_intended_for:
        - Inline blocking or deny-listing of ONYPHE scanner IPs
        - Blacklisting or threat-intelligence classification of ONYPHE infrastructure
        - Operational security controls that depend on ONYPHE IPs being hostile
      license: CC0 1.0 Universal (CC0 1.0) — Public Domain Dedication
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: 'CC0 1.0 Universal Public Domain Dedication: the licensor has dedicated
          this work to the public domain worldwide and waives all copyright and related
          rights. No attribution is required. The work may be copied, modified, distributed,
          and performed without consent or credit.'
      current_status:
        state: active
        description: Active. The onyphe-scanner list is present in the misp-warninglists
          repository, regenerated from ONYPHE's published ip-ranges.txt file by the
          project's generate-all.sh workflow.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public community discussion specifically about the onyphe-scanner
          warninglist is sparse. Practitioner discourse on scanner whitelisting more
          commonly references Shodan, Censys, and GreyNoise as the well-known benign
          sources; ONYPHE appears less frequently in those conversations. No open
          issues or pull requests specifically addressing the onyphe-scanner list
          were found in the misp-warninglists tracker.
