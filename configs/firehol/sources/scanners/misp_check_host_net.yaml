  misp_check_host_net:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/check-host-net/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: scanners
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) check-host.net
      node IP address ranges. Service measurement infrastructure reference.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T20:29:39Z'
      official_name: List of known check-host.net IP address ranges
      official_url: https://github.com/MISP/misp-warninglists
      short_description: A curated list of IP address ranges used by check-host.net's
        globally distributed network monitoring nodes, maintained as a false-positive
        warning for security analysts.
      long_description: "The check-host-net warninglist identifies IP addresses belonging
        to check-host.net's distributed monitoring node network. check-host.net is
        an online service that performs availability checks, ping tests, HTTP checks,
        DNS lookups, and TCP/UDP port scans from geographically distributed servers
        operated by community sponsors. Organizations running security monitoring
        may observe inbound connections from these node IPs during legitimate diagnostic
        activity initiated by their own or third parties' check-host.net users — this
        list helps analysts recognise that such traffic originates from the check-host.net
        infrastructure rather than hostile scanning.\n\nThe list is generated by a
        Python script (tools/generate-check-host-net.py) that downloads the current
        node roster from check-host.net's public API endpoint (check-host.net/nodes/ips)
        and consolidates the individual IP addresses into CIDR-formatted blocks. The
        resulting list is committed to the MISP warninglists repository as a CIDR-type
        warninglist matching on ip-src, ip-dst, domain|ip, and port-variant attributes."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: research_institution
        official_url: https://github.com/MISP
        contact_email:
        based_in:
        active_since: '2016'
        notes: The MISP Project develops and maintains the misp-warninglists collection,
          including this check-host.net warninglist. The project was created in April
          2016 and operates as an open-source threat intelligence research initiative.
      - role: source_contributor
        name: check-host.net
        organization_type: individual
        official_url: https://check-host.net
        contact_email:
        based_in:
        active_since:
        notes: check-host.net operates the distributed node network whose IP addresses
          populate this warninglist. The service publishes its node roster publicly
          at https://check-host.net/nodes/ips, which the MISP generator script consumes.
          check-host.net accepts sponsored nodes from community members who provide
          server infrastructure.
      derivation:
        type: extraction
        description: The feed is produced by a Python generator script that downloads
          the current node roster from check-host.net's public JSON API endpoint,
          parses the IP list from the response, passes each IP through a network consolidation
          step that merges adjacent addresses into CIDR blocks, and writes the result
          as a MISP warninglist JSON file. The script is executed manually or via
          external scheduling — no automatic update cadence is embedded in the tooling
          itself. The resulting list is committed to the misp-warninglists GitHub
          repository and made available as a downloadable JSON file.
        source_feeds: []
      listing_policy:
        summary: Any IP address that appears in check-host.net's publicly published
          node roster is included in the warninglist. The list is regenerated by re-running
          the generator script, which re-fetches the current node list from check-host.net's
          API and recompiles the warninglist. There is no manual review gate — inclusion
          is automatic based on presence in the upstream node roster.
        criteria:
        - IP address appears in check-host.net's publicly accessible node roster at
          https://check-host.net/nodes/ips
      unlisting_policy:
        summary: There is no stated manual unlisting mechanism. Because the list is
          regenerated from check-host.net's live node roster, IPs are effectively
          removed when check-host.net retires or renumbers a node and the generator
          script is re-executed. Between regenerations, a previously listed IP remains
          until the next regeneration run.
        criteria:
        - check-host.net removes the IP from its public node roster at https://check-host.net/nodes/ips
      unlist_request:
      update_frequency:
      detection_classification:
        primary_method: policy_assignment
        secondary_methods: []
        description: The feed classifies infrastructure rather than detecting threats.
          It maps IP addresses to a known benign service — check-host.net's distributed
          monitoring nodes — so that security analysts can recognize diagnostic traffic
          originating from the check-host.net service and avoid falsely attributing
          it to malicious activity. The classification is produced by extracting IPs
          from check-host.net's publicly published node roster and consolidating them
          into CIDR blocks.
      scope_and_intent:
        description: The feed is intended to help security analysts and automated
          detection systems recognize traffic associated with check-host.net's distributed
          monitoring infrastructure. When an analyst encounters an inbound connection
          from one of these IPs, matching the warninglist indicates the source is
          a check-host.net node performing a diagnostic check — typically initiated
          by a third party who submitted the analyst's IP or domain for testing —
          rather than hostile reconnaissance.
        intended_for:
        - Security analysts investigating inbound scanning or probing traffic
        - SOC teams receiving alerts on connections from check-host.net node IPs
        - Automated alert triage pipelines that need to suppress or deprioritize known-infrastructure
          sources
        not_intended_for:
        - Inline blocking — the list is not a blocklist and should not be used to
          deny traffic
        - Attribution of malicious activity — matching this list indicates the source
          is check-host.net infrastructure, not that the activity is benign
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed: true
        attribution_required:
        terms: CC0 1.0 Universal public domain dedication imposes no restrictions
          on redistribution or commercial use. The licensor has waived all rights
          worldwide under copyright law to the extent permitted by law.
      current_status:
        state: active
        description: The MISP warninglists project remains actively maintained as
          of May 2026, with the most recent repository push on May 4, 2026. The check-host.net
          warninglist was added to the collection in April 2024. The list.json file
          carries version 20240402, indicating the last regeneration occurred on April
          2, 2024. No discontinuation announcement has been found.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: "The check-host.net warninglist specifically has minimal isolated
          community visibility — no dedicated GitHub issues, Reddit threads, or third-party
          blog posts discussing this particular list were found. Public engagement
          appears entirely upstream-driven: changes happen when check-host.net's node
          roster shifts and the generator script is re-run, not through ongoing discussion
          of the warninglist itself."
      sources_consulted:
