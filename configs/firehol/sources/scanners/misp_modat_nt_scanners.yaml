  misp_modat_nt_scanners:
    license: CC0 1.0 Universal (Public Domain Dedication)
    redistributable: true
    url: 
      https://raw.githubusercontent.com/MISP/misp-warninglists/main/lists/modat-nt-scanning/list.json
    frequency: 1440
    ipv: ipv4
    output: netset
    processor:
    - extract_ipv4_cidr
    processor_raw: extract_ipv4_cidr_from_any_file
    category: scanners
    provenance: secondary_upstream
    info: '[MISP warninglists](https://github.com/MISP/misp-warninglists) Modat scanner
      ranges extracted from CIRCL network telescope analysis. Informational - not
      for blocking.'
    maintainer: MISP Project
    maintainer_url: https://github.com/MISP/misp-warninglists
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T22:18:42Z'
      official_name: Modat IP Ranges Used for Scanning
      official_url: https://github.com/MISP/misp-warninglists/tree/main/lists/modat-nt-scanning
      short_description: A MISP warninglist of CIDR ranges associated with Modat internet
        scanning infrastructure, identified through CIRCL's darknet observation program
        and published as an informational alert for analysts.
      long_description: "The modat-nt-scanning warninglist tracks IP address ranges
        used by Modat, an internet scanning and asset-discovery service. Unlike the
        companion modat-scanner list (which mirrors Modat.io's openly-published IP
        ranges), this list is derived from passive observation by CIRCL's network
        telescope infrastructure — a system that monitors routable but unused IP address
        space to capture all unsolicited inbound traffic.\n\nCIRCL (Computer Incident
        Response Center Luxembourg) operates honeybots and darknet sensors across
        partner networks in Luxembourg and beyond, collecting scanning probe data
        through the D4 (Distributed Detection and Dissection) open-source protocol.
        When IPs from Modat's scanning infrastructure are observed hitting CIRCL's
        darknet, their CIDR ranges are extracted and contributed to the MISP warninglists
        repository. The list is maintained by the MISP Project with contributions
        from CIRCL researchers.\n\nWarninglists in MISP are informational aids — they
        trigger alert boxes when matching IPs appear in events or attributes, helping
        analysts recognise known scanning infrastructure rather than treating it as
        malicious. Per the list's own description, this feed is not intended for inline
        blocking."
      roles:
      - role: maintainer
        name: MISP Project
        organization_type: research_institution
        official_url: https://github.com/MISP
        contact_email:
        based_in: Luxembourg
        active_since: '2014'
        notes: Hosts and curates the MISP warninglists repository. Accepts contributions
          via pull requests. Integrates warninglists into the MISP threat intelligence
          platform and exposes them via PyMISPWarningLists and Earthly build targets.
      - role: source_contributor
        name: CIRCL Luxembourg
        organization_type: research_institution
        official_url: https://www.circl.lu
        contact_email:
        based_in: Luxembourg
        active_since: '2012'
        notes: Contributes the network telescope observation data that drives this
          list. Operates honeybot sensors and darknet monitors across partner networks,
          processing captured scanning traffic through the D4 Project pipeline.
      - role: source_contributor
        name: Paul Jung (Thanat0s)
        organization_type: individual
        official_url: https://github.com/Thanat0s
        contact_email:
        based_in:
        active_since:
        notes: 'Primary contributor of network telescope scanning lists to the MISP
          warninglists repository. Authored PRs #317, #320, #325, #330, and #335 updating
          modat-nt-scanning and related lists.'
      derivation:
        type: original
        description: The list is produced by extracting CIDR ranges from CIRCL's network
          telescope observation data. CIRCL operates a distributed network of honeybot
          sensors and darknet monitors (blackhole collectors) deployed across partner
          networks in Luxembourg and beyond, using the open-source D4 Project protocol
          for encrypted sensor-to-server data transport. When Modat's scanning infrastructure
          is observed generating unsolicited probes against CIRCL's monitored address
          space, the originating IP ranges are identified and contributed to the MISP
          warninglists repository. The list uses CIDR-type matching against ip-src,
          ip-dst, and port-combined attributes in MISP events. Overlapping networks
          are consolidated before publication.
        source_feeds: []
      listing_policy:
        summary: IPs are added when CIRCL's network telescope infrastructure observes
          Modat scanning infrastructure generating unsolicited probes against monitored
          darknet address space. The contributing researcher extracts the observed
          IP ranges and submits them as a MISP warninglist via pull request.
        criteria:
        - Observed generating unsolicited scanning probes against CIRCL's darknet
          address space
        - Attributed to Modat's internet scanning infrastructure by the contributing
          researcher
        - Submitted via pull request to the MISP warninglists repository
      unlisting_policy:
        summary: No formal automatic expiry or manual unlisting mechanism is documented
          for this warninglist. Removal would occur through a pull request updating
          the list when Modat ceases scanning activity or when the ranges are reassigned.
        criteria:
        - Ranges no longer attributed to Modat scanning infrastructure
        - Pull request submitted by a contributor updating the list
      unlist_request:
        url: https://github.com/MISP/misp-warninglists/issues
        email:
        instructions: Submit a GitHub issue or pull request on the MISP/misp-warninglists
          repository. Changes to an existing warninglist require incrementing the
          version number before triggering an update in MISP.
      update_frequency:
        frequency: 30d
        human_readable: Updated approximately monthly, per the maintainer's observed
          release cadence (PRs merged in February, March, and May 2026).
      detection_classification:
        primary_method: network_telescope
        secondary_methods: []
        description: The list is built from passive darknet observation. CIRCL's network
          telescope monitors routable but unused IP address space (darknet/blackhole
          ranges) across a distributed sensor network. Unsolicited inbound traffic
          reaching this address space — including scanning probes — is captured, timestamped,
          and analysed. When Modat's scanning infrastructure is identified as a source
          of such probes, the originating CIDR ranges are extracted and contributed
          to the warninglists. This is a passive, non-invasive detection method that
          does not send traffic to the target IPs.
      scope_and_intent:
        description: Tracks IP ranges used by Modat, an internet scanning and asset-discovery
          service. The list distinguishes Modat's scanning infrastructure from genuinely
          malicious activity — alerting analysts when these IPs appear in their data
          so they can apply appropriate context rather than treating the IPs as threats.
        intended_for:
        - MISP event enrichment and analyst alerting
        - False-positive reduction when Modat IPs appear in threat intelligence
        - Distinguishing known scanning infrastructure from attacker infrastructure
        not_intended_for:
        - Inline blocking or deny-listing at the network perimeter
        - Treating Modat IPs as malicious indicators
      license: CC0 1.0 Universal (Public Domain Dedication)
      redistribution:
        allowed: true
        commercial_use_allowed:
        attribution_required:
        terms: CC0 1.0 Universal dedicates the work to the public domain worldwide.
          No rights are reserved. Users may copy, modify, distribute, and use the
          work, even for commercial purposes, without permission.
      current_status:
        state: active
        description: 'Actively maintained. PR #335 updating modat-nt-scanning was
          merged on May 4, 2026, by Paul Jung (Thanat0s). The list is part of a regular
          monthly refresh cycle covering approximately 20 nt-scanning lists.'
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: Public discussion of this specific list is sparse. The upstream
          repository's pull-request flow is the primary venue for contributions; no
          dedicated public issue tracker threads, Reddit discussions, or mailing-list
          posts about modat-nt-scanning were found.
