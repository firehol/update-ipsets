    category: messaging_abuse
    info: '[projecthoneypot.org](http://www.projecthoneypot.org/?rf=192670) comment
      spammers (this list is composed using an RSS feed)'
    maintainer: ProjectHoneypot.org
    maintainer_url: http://www.projecthoneypot.org/
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-18T03:11:08Z'
      official_name: Malicious IPs | By Last Bad Event | Project Honey Pot
      official_url: http://www.projecthoneypot.org/list_of_ips.php?t=c
      short_description: IP addresses used by comment spammers identified through
        Project Honey Pot's distributed honeypot network.
      long_description: "The Comment Spammers feed (`t=c`) publishes IPv4 addresses
        observed posting promotional content to HTML forms embedded on websites participating
        in the Project Honey Pot network. The maintainer's definition is narrow: comment
        spammers do not send email spam — they target blogs, forums, and other comment
        systems with posts that typically include links promoting external sites,
        aimed at driving traffic and manipulating search engine rankings.\n\nDetection
        is form-based rather than email-based. Participating webmasters install specially
        crafted HTML forms on their sites; any automated submission to one of those
        forms attributes the originating IP, timestamp, and submitted payload to the
        central database. This distinguishes the Comment Spammers feed from the maintainer's
        sibling Harvesters and Spam Servers feeds, which derive from email-trap observations.\n\
        \nThe maintainer notes on the directory page that being listed does not necessarily
        mean an IP address is owned by a spammer — it may have been hijacked from
        its true owner. The feed is intended for website administrators protecting
        blogs, forums, and comment systems."
      roles:
      - role: maintainer
        name: Unspam Technologies, Inc.
        organization_type: commercial
        official_url: http://www.projecthoneypot.org/
        contact_email:
        based_in: Murray, Utah, USA
        active_since: '2004'
        notes: Anti-spam company with the stated mission of designing and enforcing
          effective anti-spam laws. Operates Project Honey Pot as a community-based
          system where participants contribute data and benefit from shared intelligence.
      derivation:
        type: original
        description: The feed is built from Project Honey Pot's own distributed honeypot
          network. Participating website administrators install specially tagged email
          addresses and HTML forms on their sites; the system distributes unique addresses
          per visitor and receives mail or form submissions generated by bots that
          visit the site. Observations are collated and the IP addresses observed
          harvesting addresses or submitting comment-spam posts are published. No
          external IP feeds are consumed.
        source_feeds: []
      listing_policy:
        summary: An IP is listed when it is observed posting promotional content to
          HTML forms on Project Honey Pot-participating websites, or when it is observed
          harvesting the specially tagged email addresses distributed by the honeypot
          network. The honeypot system assigns each address a unique tag tied to the
          visitor's IP and the time of visitation; any incoming mail or form submission
          to that address triggers a listing event. Multiple observations accumulate
          a threat score (0–255, logarithmic scale) reflecting the severity and frequency
          of observed activity.
        criteria:
        - Observed submitting comment-spam content to HTML forms on participating
          honey pot sites
        - Observed harvesting tagged email addresses distributed by the honeypot network
        - Activity contributes to a cumulative threat score (logarithmic, 0–255)
      unlisting_policy:
        summary: IPs are removed through a self-service whitelist form. Approved requests
          propagate within approximately one hour. A whitelist delay penalty applies
          to IPs that are subsequently delisted again due to new bad activity — the
          delay starts at 5 seconds and increases with each repeat offense. IPs with
          no suspicious activity for 90 consecutive days are automatically marked
          as most likely clean and trustworthy on their public inspection page.
        criteria:
        - Self-service whitelist form submission approved (requires connecting from
          the IP or its /24 subnet, plus CAPTCHA)
        - Automatic expiry after 90 days of no further suspicious activity
        - Automatic delisting if bad activity resumes after whitelisting
      unlist_request:
        url: http://www.projecthoneypot.org/white_list.php
        email:
        instructions: 'Submit a whitelist request through the web form at projecthoneypot.org/white_list.php.
          The requesting IP must be within the /24 subnet of the IP to be whitelisted.
          Select a reason from the dropdown: Belongs to a Search Engine, Hit by a
          virus or trojan, Mistaken Listing, Owner of a Dynamic IP Address, or Other.
          Complete the CAPTCHA and submit. Approved requests propagate within approximately
          one hour. No public email address is provided for IP removal requests.'
      update_frequency:
        frequency: 60m
        human_readable: The maintainer processes monitoring reports several times
          per day, with a stated maximum lag of 24 hours between suspicious activity
          and notification. The catalog refreshes the feed every 60 minutes.
      detection_classification:
        primary_method: honeypot
        secondary_methods: []
        description: The feed is built from honeypot observations. Participating website
          administrators embed specially tagged email addresses and HTML forms on
          their sites. Each address is unique to a specific visitor session; when
          a bot harvests an address or submits comment-spam content to a form, the
          event is logged with the bot's IP and timestamp. Comment spammers are distinguished
          from other threat types (harvesters, dictionary attackers) by the specific
          behavior of posting to HTML forms rather than accessing email addresses.
      scope_and_intent:
        description: The feed identifies IP addresses used by comment spammers — bots
          that post promotional links to blogs and forums to drive traffic and manipulate
          search engine rankings. Data is drawn from the honeypot network's observations
          of form-submission events.
        intended_for:
        - Protecting blogs and forums from automated comment-spam posts
        - Blocking bots observed posting promotional links to websites
        - Identifying compromised networks used for comment-spam operations
        not_intended_for:
        - Email spam filtering (comment spammers do not send email)
        - Blocking search engine crawlers
        - Determining whether an IP inherently belongs to a spammer (IPs may be hijacked
          or dynamically reassigned)
      license: Project Honey Pot Terms of Use — All Rights Reserved
      redistribution:
        allowed: false
        commercial_use_allowed:
        attribution_required:
        terms: The Terms of Use prohibit unauthorized reproduction, scraping, harvesting,
          storing, or transferring data from the website to a third party. Automated
          collection by non-human visitors (bots, crawlers) is expressly prohibited
          except within the bounds of the limited personal-use license. Resale of
          Project Honey Pot services is prohibited.
      current_status:
        state: active
        description: The feed is actively maintained. The maintainer's website is
          reachable, the Comment Spammers RSS feed returns valid XML with current
          build timestamps, and the live statistics page confirms ongoing operation.
          No discontinuation or migration notice was found.
        successor:
        announcement_date:
      community:
        awards:
        criticism: Operators of blog/forum protection plugins consume this feed indirectly
          and may not realize a downstream listing is sourced from Project Honey Pot.
          When a listed IP is reassigned to a different end-user by an ISP, the new
          user can be blocked from posting comments without any way to discover the
          origin of the block; the maintainer's whitelist form is the documented resolution
          path but requires the affected user to identify Project Honey Pot as the
          source first.
        engagement: Public discussion of this specific feed (versus the maintainer's
          overall Project Honey Pot platform) is sparse. Most third-party troubleshooting
          threads on Reddit and similar forums focus on individual false-positive
          resolution rather than evaluating the Comment Spammers list as a standalone
          data product.
