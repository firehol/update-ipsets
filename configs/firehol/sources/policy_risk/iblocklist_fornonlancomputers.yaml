    processor_raw: p2p_gz
    category: policy_risk
    provenance: secondary_upstream
    info: IP blocklist for non-LAN computers.
    maintainer: iBlocklist.com
    maintainer_url: https://www.iblocklist.com/
    enabled_by_all: true
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-19T05:54:45Z'
      official_name: fornonlancomputers
      official_url: https://www.iblocklist.com/list?list=jhaoawihmfxgnvmaqffp
      short_description: A blocklist covering all publicly routable (non-private)
        IP address space, published by Bluetack and distributed via iBlocklist.com.
      long_description: "The fornonlancomputers list is an IP blocklist published
        by Bluetack Internet Security Solutions and distributed via iBlocklist.com.
        Rather than enumerating known-malicious IPs, it takes the inverse approach:
        it covers all publicly routable (WAN) IP address space — effectively every
        IP address that is not part of a private LAN as defined by RFC 1918.\n\nThe
        list is generated using Bluetack's proprietary B.I.M.S. (Bluetack Internet
        Management System), which spiders WHOIS servers to build a comprehensive map
        of allocated internet address ranges and flags entries based on organizational
        criteria. Per the PeerGuardian Wikipedia article, B.I.M.S. was developed by
        the Bluetack.co.uk team to identify anti-P2P companies and other organizations
        of concern by searching WHOIS records and assigning status codes that generate
        downloadable blocklists. The fornonlancomputers list operates independently
        of Bluetack's tiered categorization (level1/level2/level3) — it is a global
        exclusion list covering all non-private IP space.\n\nThe list is distributed
        in P2P format (GZIP-compressed CSV), compatible with PeerGuardian, PeerBlock,
        iplist, Vuze, Transmission, uTorrent, Tixati, and pfBlocker. The original
        Bluetack.co.uk operation ceased around 2014–2015, so the underlying source
        has not received active maintenance since."
      roles:
      - role: maintainer
        name: Bluetack
        organization_type: unknown
        official_url: https://bluetack.co.uk
        contact_email:
        based_in:
        active_since:
        notes: Bluetack Internet Security Solutions authored the fornonlancomputers
          list and the B.I.M.S. system that generates it. The original Bluetack.co.uk
          operation is reported to have ceased around 2014.
      - role: publisher
        name: iBlocklist.com
        organization_type: commercial
        official_url: https://www.iblocklist.com/
        contact_email:
        based_in:
        active_since:
        notes: iBlocklist.com (iblocklist, LLC) distributes the list in P2P, DAT,
          and CIDR formats. The service requires a paid subscription. Publisher-level
          community reports describe the service as unresponsive to support inquiries
          and document subscription/billing complaints.
      derivation:
        type: partial_mirror
        description: "The original list is generated by Bluetack's B.I.M.S. (Bluetack
          Internet Management System), which spiders WHOIS servers to build a comprehensive
          map of all allocated internet IP address ranges. Administrators query this
          database to assign status codes to IP ranges matching target criteria, producing
          downloadable blocklists. The fornonlancomputers list applies a global exclusion
          logic: all non-private (non-RFC1918) address space is included, rather than
          curating specific organizations. iBlocklist.com republishes the Bluetack
          output in P2P format; it does not modify the underlying curation."
        source_feeds: []
      listing_policy:
        summary: 'The list applies a blanket-coverage approach: all publicly routable
          (non-private) IP address space is included by default. There are no per-entry
          inclusion criteria in the traditional sense — the scope is defined by what
          is NOT a private LAN address (the RFC 1918 private address ranges). This
          inverted logic means any IP reachable from the public internet falls within
          scope.'
        criteria:
        - Any IPv4 address that is not within the RFC 1918 private address space
      unlisting_policy:
        summary: No unlisting or removal policy is published by iBlocklist.com or
          Bluetack. The iBlocklist.com support page returns only a PhantomPeer VPN
          advertisement with no contact form, help documentation, or removal instructions.
          Community reports dating back to 2016 indicate support requests go unanswered.
          Given the list's inverted-logic design (covering all non-private IP space),
          removal of a specific IP from this list would require a fundamental redesign
          of the list's scope — which is not addressed in any published documentation.
        criteria: []
      unlist_request:
        url:
        email:
        instructions: No removal request channel is publicly documented. The iBlocklist.com
          support page (https://www.iblocklist.com/support) returns only a PhantomPeer
          VPN advertisement with no functional contact form or help resources. Community
          reports indicate that support requests submitted through any channel have
          gone unanswered since 2016. There is no documented process for requesting
          IP removal from this list.
      update_frequency:
        frequency: 720h
        human_readable: The catalog YAML records a refresh interval of 720 hours (30
          days), per the maintainer's distribution settings.
      detection_classification:
        primary_method: policy_assignment
        secondary_methods: []
        description: 'The list is built using a policy-assignment approach: rather
          than detecting malicious activity through sensors, honeypots, or user reports,
          it defines a blanket policy that all publicly routable (non-private) IP
          address space should be blocked. The B.I.M.S. system populates entries by
          querying a WHOIS-derived database of allocated IP ranges and assigning status
          codes based on organizational criteria. The fornonlancomputers list applies
          a global exclusion rule — all non-RFC1918 addresses fall within scope —
          rather than targeting specific organizations.'
      scope_and_intent:
        description: The list is designed to block all inbound connections from the
          public internet during P2P file-sharing sessions, allowing the user to connect
          only to peers on their local private network. It complements Bluetack's
          tiered lists (level1/level2/level3) by providing a global baseline exclusion.
        intended_for:
        - P2P privacy — blocking inbound connections from publicly routable IP addresses
          during file-sharing sessions
        - Firewall administrators seeking to whitelist only RFC 1918 private subnets
          and drop all unsolicited WAN traffic
        not_intended_for:
        - General-purpose network security blocking (the list covers all public internet
          space, not threat-specific IPs)
        - Commercial deployments (the Terms of Service prohibit commercial use)
      license: iBlocklist Terms of Service — personal / non-commercial only
      redistribution:
        allowed: false
        commercial_use_allowed: false
        attribution_required:
        terms: Redistribution is not explicitly addressed in the ToS beyond the personal-use
          license grant. The ToS restricts use to personal use and prohibits commercial
          purpose or public display. Based on these terms, redistribution to third
          parties — whether free or commercial — is not permitted under the stated
          license.
      current_status:
        state: unknown
        description: The iBlocklist.com website is reachable and the list URL resolves.
          The upstream Bluetack project (the list's original author) ceased operations
          around 2014–2015, so the list's source data has not been actively maintained
          since. No explicit discontinuation announcement for this list was found
          from iBlocklist.com itself.
        successor:
        announcement_date:
      community:
        awards:
        criticism: Community forum threads report that Bluetack-sourced lists, including
          this one, stopped receiving meaningful content updates around November 2014.
          A pfBlockerNG moderator (BBcan177) has advised against using unmaintained
          Bluetack feeds.
        engagement: Public community discussion specifically about the fornonlancomputers
          list is sparse. Searches across Reddit, Netgate Forum, and security practitioner
          communities returned no direct discussions about this specific list. The
          list is not integrated into any major open-source security project or SIEM
          platform as an actively-maintained source.
