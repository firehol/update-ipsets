      short_description: IP addresses registered to Steam and Valve game server infrastructure.
      long_description: "The Steam list publishes IP address ranges allocated to Valve
        Corporation for Steam services, game servers, matchmaking, content delivery,
        and related infrastructure. Network administrators and privacy-conscious users
        employ this list to configure firewall rules, routing exceptions, or peer-to-peer
        protection software (PeerBlock, PeerGuardian, iplist, and similar) to control
        Steam-related network traffic.\n\nPer the maintainer's description, the list
        covers IPs registered to Steam and other IPs needed for game functionality.
        The list is distributed in P2P, DAT, and CIDR formats, compatible with a range
        of client-side filtering applications. The maintainer does not publicly document
        the sourcing methodology for this specific feed."
