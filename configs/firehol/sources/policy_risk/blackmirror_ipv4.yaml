        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement: 'The project has accumulated 215 stars and 12 forks on GitHub
          (as of May 2026), per the GitHub API. Eight active GitHub Discussions threads
          demonstrate regular community participation, covering source additions,
          whitelist requests, and methodology debates. Discussion #48 shows substantive
          exchange between the maintainer and community contributors on source evaluation
          criteria. Seven open issues are all feature requests or maintenance tasks;
          no false-positive complaints were found in the open issues. The maintainer
          responds to community proposals and has accepted contributions from outside
          developers. Public discussion outside GitHub is sparse — no notable Reddit
          threads or third-party blog coverage were found during research.'
