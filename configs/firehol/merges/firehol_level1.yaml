merges:
  firehol_level1:
    license: Composite of component feed licenses
    redistributable: true
    frequency: 5
    ipv: ipv4
    output: netset
    category: intrusion
    info: A firewall blacklist composed from IP lists, providing maximum protection
      with minimum false positives. Suitable for basic protection on all internet
      facing servers, routers and firewalls.
    maintainer: FireHOL
    maintainer_url: http://iplists.firehol.org/
    sources:
    - dshield
    - feodo
    - fullbogons
    - spamhaus_drop
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-27T06:30:35Z'
      official_name: FireHOL Level 1
      official_url:
      short_description: Conservative aggregate merge for edge blocking — low false-positive
        components only, suitable for internet-facing servers, routers, and firewalls.
      long_description: "The most conservative of the FireHOL composite merges. Combines
        well-established low-false-positive feeds (DShield, Feodo Tracker, Cymru Fullbogons,
        Spamhaus DROP) into a single additive union. Intended for environments where
        false positives are costly — edge firewalls protecting internet-facing services,
        where blocking a legitimate IP causes immediate business impact. The merge
        inherits all listing decisions from its component feeds and does not maintain
        its own whitelisting.\n\nComponents: dshield, feodo, fullbogons, spamhaus_drop."
      roles:
      - role: maintainer
        name: FireHOL catalog project
        organization_type: informal_collective
        official_url:
        contact_email:
        based_in:
        active_since:
        notes: Maintained by the FireHOL catalog project as a public reference / aggregate.
          This page is generated deterministically from the catalog YAML; the agent-based
          enrichment used for third-party feeds does not run on FireHOL-maintained
          feeds.
      derivation:
        type: aggregate_merge
        description: Additive union of 4 component feed(s). The merge applies no scoring,
          threshold, or filter beyond the union and the optional subtraction; all
          listing decisions are inherited from the component feeds. Component feeds
          are recomposed on each catalog refresh.
        source_feeds:
        - identifier: dshield
          relationship: aggregate_component
          notes:
        - identifier: feodo
          relationship: aggregate_component
          notes:
        - identifier: fullbogons
          relationship: aggregate_component
          notes:
        - identifier: spamhaus_drop
          relationship: aggregate_component
          notes:
      listing_policy:
        summary: An IP appears in this merge if it appears in any of the 4 additive
          component feed(s) listed below. The merge does not add IPs of its own.
        criteria:
        - 'IP appears in one or more of the additive component feeds: dshield, feodo,
          fullbogons, spamhaus_drop.'
      unlisting_policy:
        summary: Inherited from the component feeds. The merge does not maintain its
          own whitelisting or per-entry unlist process. When a component feed removes
          an IP, the next merge refresh drops the IP unless another component still
          lists it.
        criteria:
        - All component feeds that previously listed the IP have removed it.
      unlist_request:
        url:
        email:
        instructions: 'This is an aggregate merge of component feeds; the merge does
          not maintain its own unlist channel. To request that an IP be removed, identify
          which component feed(s) list it and submit the removal request directly
          to that maintainer. Component feeds: dshield, feodo, fullbogons, spamhaus_drop.'
      update_frequency:
      detection_classification:
        primary_method: mixed
        secondary_methods: []
        description: 'This merge inherits detection methodology from its 4 additive
          component feed(s). See each component for its specific detection method
          (honeypot, sandbox, reputation aggregation, etc.). Component feeds: dshield,
          feodo, fullbogons, spamhaus_drop.'
      scope_and_intent:
        description: The most conservative of the FireHOL composite merges. Combines
          well-established low-false-positive feeds (DShield, Feodo Tracker, Cymru
          Fullbogons, Spamhaus DROP) into a single additive union. Intended for environments
          where false positives are costly — edge firewalls protecting internet-facing
          services, where blocking a legitimate IP causes immediate business impact.
          The merge inherits all listing decisions from its component feeds and does
          not maintain its own whitelisting.
        intended_for:
        - Edge firewall block lists for internet-facing services
        - Conservative perimeter blocking where FP cost is high
        not_intended_for:
        - Comprehensive coverage — see level3/level4 for broader aggregates
        - Operator-specific whitelisting decisions (handled at the component-feed
          level)
      license: Composite of component feed licenses
      redistribution:
        allowed: true
        commercial_use_allowed:
        attribution_required:
        terms: Component-feed license terms continue to apply; users should consult
          each component's license before commercial or redistribution use.
      current_status:
        state: active
        description: Maintained by FireHOL as a public catalog merge. Recomposed automatically
          on each catalog refresh from the live state of the component feeds. Component
          feeds that go offline or are archived are dropped from the merge by the
          catalog engine.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement:
      sources_consulted: []
