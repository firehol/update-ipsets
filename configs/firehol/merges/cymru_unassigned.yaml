merges:
  cymru_unassigned:
    label: Team Cymru unassigned
    frequency: 1440
    ipv: ipv4
    output: netset
    category: special_use
    use: [bogons]
    license: 'Free — no restrictions stated on https://www.team-cymru.com/bogon-reference-http
      ("Free. Forever.")'
    redistributable: true
    info: Team Cymru fullbogons with traditional bogons subtracted, leaving RIR-allocated
      space not assigned by the RIR to an ISP or other end-user.
    maintainer: FireHOL
    maintainer_url: http://iplists.firehol.org/
    sources:
    - fullbogons
    exclude:
    - bogons
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-27T06:30:35Z'
      official_name: Team Cymru unassigned (bogons-class)
      official_url:
      short_description: Bogons-class aggregate combining Team Cymru's IP allocation
        tracking.
      long_description: "A bogons-class aggregate combining Team Cymru's IP allocation
        tracking. Tracks IP space that is not yet allocated to a Regional Internet
        Registry (RIR) end-user. Useful for filtering fully-unallocated address space
        at internet-facing borders. Component feed drives all listings.\n\nComponents:
        fullbogons. Excluded: bogons."
      roles:
      - role: maintainer
        name: FireHOL catalog project
        organization_type: informal_collective
        official_url:
        contact_email:
        based_in:
        active_since:
        notes: Maintained by the FireHOL catalog project as a public reference / aggregate.
          This page is generated deterministically from the catalog YAML; the agent-based
          enrichment used for third-party feeds does not run on FireHOL-maintained
          feeds.
      derivation:
        type: aggregate_merge
        description: Additive union of 1 additive component feed(s) (fullbogons),
          with 1 subtractive component feed(s) excluded from the result (bogons).
          The merge applies no scoring, threshold, or filter beyond the union and
          the optional subtraction; all listing decisions are inherited from the component
          feeds. Component feeds are recomposed on each catalog refresh.
        source_feeds:
        - identifier: fullbogons
          relationship: aggregate_component
          notes:
        - identifier: bogons
          relationship: filtered
          notes: Subtracted from the merge result.
      listing_policy:
        summary: An IP appears in this merge if it appears in any of the 1 additive
          component feed(s) (fullbogons) AND does not appear in any of the 1 subtractive
          component feed(s) (bogons). The merge does not add IPs of its own.
        criteria:
        - 'IP appears in one or more of the additive component feeds: fullbogons.'
        - 'IP does not appear in any of the subtractive component feeds: bogons.'
      unlisting_policy:
        summary: Inherited from the component feeds. The merge does not maintain its
          own whitelisting or per-entry unlist process. When a component feed removes
          an IP, the next merge refresh drops the IP unless another component still
          lists it.
        criteria:
        - All component feeds that previously listed the IP have removed it.
      unlist_request:
        url:
        email:
        instructions: 'This is an aggregate merge of component feeds; the merge does
          not maintain its own unlist channel. To request that an IP be removed, identify
          which component feed(s) list it and submit the removal request directly
          to that maintainer. Component feeds: fullbogons. Subtractive feeds (whose
          entries are removed from the merge): bogons.'
      update_frequency:
      detection_classification:
        primary_method: mixed
        secondary_methods: []
        description: 'This merge inherits detection methodology from its 1 additive
          component feed(s). See each component for its specific detection method
          (honeypot, sandbox, reputation aggregation, etc.). Component feeds: fullbogons.
          1 subtractive component feed(s) (bogons) remove their entries from the result
          and therefore shape what this merge ultimately classifies.'
      scope_and_intent:
        description: A bogons-class aggregate combining Team Cymru's IP allocation
          tracking. Tracks IP space that is not yet allocated to a Regional Internet
          Registry (RIR) end-user. Useful for filtering fully-unallocated address
          space at internet-facing borders. Component feed drives all listings.
        intended_for:
        - Bogon filtering at internet-facing routers
        - Detection of spoofed source addresses
        not_intended_for: []
      license: Free — no restrictions stated on https://www.team-cymru.com/bogon-reference-http
        ("Free. Forever.")
      redistribution:
        allowed: true
        commercial_use_allowed:
        attribution_required:
        terms: Component-feed license terms continue to apply; users should consult
          each component's license before commercial or redistribution use.
      current_status:
        state: active
        description: Maintained by FireHOL as a public catalog merge. Recomposed automatically
          on each catalog refresh from the live state of the component feeds. Component
          feeds that go offline or are archived are dropped from the merge by the
          catalog engine.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement:
      sources_consulted: []
