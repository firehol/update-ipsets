merges:
  firehol_webserver:
    license: Composite of component feed licenses
    redistributable: true
    frequency: 5
    ipv: ipv4
    output: netset
    category: service_abuse
    info: A web server IP blacklist made from blocklists that track IPs that should
      never be used by your web users. (This list includes IPs that are servers hosting
      malware, bots, etc or users having a long criminal history. This list is to
      be used on top of firehol_level1, firehol_level2, firehol_level3 and possibly
      firehol_proxies or firehol_anonymous).
    maintainer: FireHOL
    maintainer_url: http://iplists.firehol.org/
    sources:
    - myip
    - stopforumspam_toxic
    enrichment:
      enrichment_schema_version: 2
      run_at: '2026-05-27T06:30:35Z'
      official_name: FireHOL Web Server
      official_url:
      short_description: Aggregate of feeds covering IPs implicated in attacks against
        web servers.
      long_description: "An aggregate merge of feeds covering IP addresses implicated
        in attacks against web servers — scanners, automated exploit attempts, brute-force
        login sources, and WAF-flagged abusers targeting public web infrastructure.
        Component feeds drive all listings.\n\nComponents: myip, stopforumspam_toxic."
      roles:
      - role: maintainer
        name: FireHOL catalog project
        organization_type: informal_collective
        official_url:
        contact_email:
        based_in:
        active_since:
        notes: Maintained by the FireHOL catalog project as a public reference / aggregate.
          This page is generated deterministically from the catalog YAML; the agent-based
          enrichment used for third-party feeds does not run on FireHOL-maintained
          feeds.
      derivation:
        type: aggregate_merge
        description: Additive union of 2 component feed(s). The merge applies no scoring,
          threshold, or filter beyond the union and the optional subtraction; all
          listing decisions are inherited from the component feeds. Component feeds
          are recomposed on each catalog refresh.
        source_feeds:
        - identifier: myip
          relationship: aggregate_component
          notes:
        - identifier: stopforumspam_toxic
          relationship: aggregate_component
          notes:
      listing_policy:
        summary: An IP appears in this merge if it appears in any of the 2 additive
          component feed(s) listed below. The merge does not add IPs of its own.
        criteria:
        - 'IP appears in one or more of the additive component feeds: myip, stopforumspam_toxic.'
      unlisting_policy:
        summary: Inherited from the component feeds. The merge does not maintain its
          own whitelisting or per-entry unlist process. When a component feed removes
          an IP, the next merge refresh drops the IP unless another component still
          lists it.
        criteria:
        - All component feeds that previously listed the IP have removed it.
      unlist_request:
        url:
        email:
        instructions: 'This is an aggregate merge of component feeds; the merge does
          not maintain its own unlist channel. To request that an IP be removed, identify
          which component feed(s) list it and submit the removal request directly
          to that maintainer. Component feeds: myip, stopforumspam_toxic.'
      update_frequency:
      detection_classification:
        primary_method: mixed
        secondary_methods: []
        description: 'This merge inherits detection methodology from its 2 additive
          component feed(s). See each component for its specific detection method
          (honeypot, sandbox, reputation aggregation, etc.). Component feeds: myip,
          stopforumspam_toxic.'
      scope_and_intent:
        description: An aggregate merge of feeds covering IP addresses implicated
          in attacks against web servers — scanners, automated exploit attempts, brute-force
          login sources, and WAF-flagged abusers targeting public web infrastructure.
          Component feeds drive all listings.
        intended_for:
        - WAF and edge firewall protection of public web services
        - Detection rules on inbound HTTP/HTTPS traffic
        not_intended_for:
        - Blocking outbound user-browser traffic — see firehol_webclient
      license: Composite of component feed licenses
      redistribution:
        allowed: true
        commercial_use_allowed:
        attribution_required:
        terms: Component-feed license terms continue to apply; users should consult
          each component's license before commercial or redistribution use.
      current_status:
        state: active
        description: Maintained by FireHOL as a public catalog merge. Recomposed automatically
          on each catalog refresh from the live state of the component feeds. Component
          feeds that go offline or are archived are dropped from the merge by the
          catalog engine.
        successor:
        announcement_date:
      community:
        awards:
        criticism:
        engagement:
      sources_consulted: []
