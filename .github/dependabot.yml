version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /tools/dronebl2ipsets
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    groups:
      dronebl-tool-go-modules:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Etc/UTC
    cooldown:
      default-days: 1
    groups:
      ui-dependencies:
        patterns:
          - "*"
