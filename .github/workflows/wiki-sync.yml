name: Sync docs to Wiki

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-sync.yml'
      - 'scripts/build-wiki.mjs'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v6

      - name: Checkout wiki repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git clone "$repo_url" wiki

      - name: Sync docs to wiki
        run: |
          set -euo pipefail

          # GitHub Wiki renders Markdown pages from wiki-root filenames.
          # Publishing nested docs paths directly makes links such as
          # /wiki/api/api-overview.md open as raw markdown. Flatten pages and
          # rewrite local docs links to full GitHub wiki URLs so custom sidebar
          # links stay inside the wiki from every page.
          node scripts/build-wiki.mjs docs wiki "https://github.com/${GITHUB_REPOSITORY}/wiki"

      - name: Commit and push to wiki
        run: |
          set -euo pipefail

          cd wiki
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync wiki from docs/ ($(date -u +%Y-%m-%d))"
            git push origin HEAD:master
          fi
